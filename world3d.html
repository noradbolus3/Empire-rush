<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Empire Rush — Living Business City</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111827;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      position: relative;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          #9cc9ee 0%,
          #cfe5f5 42%,
          #d7e0d1 100%
        );
    }

    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* -------------------------------------------------------
       Employee information panel
       ------------------------------------------------------- */

    #employeePanel {
      position: fixed;
      right: 14px;
      top: 14px;
      width: min(320px, calc(100vw - 28px));
      max-height: calc(100vh - 28px);
      overflow-y: auto;

      padding: 16px;
      border-radius: 18px;

      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.28);

      color: #fff;

      z-index: 50;
      display: none;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    #employeePanel.visible {
      display: block;
    }

    #employeePanel h3 {
      margin: 0 0 8px;
      font-size: 19px;
      line-height: 1.2;
      font-weight: 800;
    }

    #employeePanel .employee-role {
      margin-bottom: 14px;
      color: #cbd5e1;
      font-size: 13px;
    }

    #employeePanel .employee-stat {
      display: flex;
      justify-content: space-between;
      gap: 12px;

      padding: 8px 0;

      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
    }

    #employeePanel .employee-stat:last-child {
      border-bottom: 0;
    }

    #employeePanel .employee-stat span:first-child {
      color: #94a3b8;
    }

    #employeePanel .employee-stat span:last-child {
      font-weight: 700;
      text-align: right;
    }

    #employeePanelClose {
      position: absolute;
      top: 9px;
      right: 10px;

      width: 32px;
      height: 32px;

      border: 0;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.1);
      color: #fff;

      font-size: 20px;
      line-height: 32px;
      text-align: center;

      cursor: pointer;
    }

    #employeePanelClose:active {
      transform: scale(0.94);
    }

    /* -------------------------------------------------------
       Small loading indicator
       ------------------------------------------------------- */

    #worldLoading {
      position: fixed;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 100;

      padding: 12px 18px;
      border-radius: 14px;

      background: rgba(15, 23, 42, 0.9);
      color: #fff;

      font-size: 13px;
      font-weight: 700;

      pointer-events: none;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
    }

    #worldLoading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* -------------------------------------------------------
       Mobile adjustments
       ------------------------------------------------------- */

    @media (max-width: 600px) {
      #employeePanel {
        right: 10px;
        top: 10px;
        width: calc(100vw - 20px);
        max-width: 330px;
      }
    }

    /* -------------------------------------------------------
       Prevent accidental text selection
       ------------------------------------------------------- */

    button,
    canvas,
    #employeePanel {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>

  <div id="game"></div>

  <div id="worldLoading">
    Loading Empire Rush...
  </div>

  <div id="employeePanel">

    <button id="employeePanelClose" type="button">
      ×
    </button>

    <h3 id="employeeName">
      Employee
    </h3>

    <div
      id="employeeRole"
      class="employee-role"
    >
      Employee
    </div>

    <div class="employee-stat">
      <span>Salary</span>
      <span id="employeeSalary">—</span>
    </div>

    <div class="employee-stat">
      <span>Performance</span>
      <span id="employeePerformance">—</span>
    </div>

    <div class="employee-stat">
      <span>Experience</span>
      <span id="employeeExperience">—</span>
    </div>

    <div class="employee-stat">
      <span>Morale</span>
      <span id="employeeMorale">—</span>
    </div>

    <div class="employee-stat">
      <span>Status</span>
      <span id="employeeStatus">—</span>
    </div>

  </div>

  <!-- =====================================================
       Three.js import map
       ===================================================== -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <!-- =====================================================
       EMPIRE RUSH 3D WORLD
       IMPORTANT:
       All renderer/game-world JavaScript remains inside
       this ONE module script.
       ===================================================== -->

  <script type="module">

    import * as THREE from "three";

    import { OrbitControls } from
      "three/addons/controls/OrbitControls.js";

    import { GLTFLoader } from
      "three/addons/loaders/GLTFLoader.js";

    import * as SkeletonUtils from
      "three/addons/utils/SkeletonUtils.js";


    /* =====================================================
       BASIC REFERENCES
       ===================================================== */

    const GAME = document.getElementById("game");

    const LOADING =
      document.getElementById("worldLoading");

    const EMPLOYEE_PANEL =
      document.getElementById("employeePanel");

    const EMPLOYEE_CLOSE =
      document.getElementById("employeePanelClose");


    /* =====================================================
       THREE.JS CORE
       ===================================================== */

    const scene =
      new THREE.Scene();

    scene.background =
      new THREE.Color(0xbfdcf0);


    /* =====================================================
       CAMERA
       ===================================================== */

    const camera =
      new THREE.PerspectiveCamera(
        48,
        window.innerWidth / window.innerHeight,
        0.1,
        2500
      );

    camera.position.set(
      72,
      72,
      92
    );


    /* =====================================================
       RENDERER
       ===================================================== */

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: "high-performance"
      });

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        2
      )
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight,
      false
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
      1.05;

    GAME.appendChild(renderer.domElement);


    /* =====================================================
       CAMERA CONTROLS
       ===================================================== */

    const controls =
      new OrbitControls(
        camera,
        renderer.domElement
      );

    controls.enableDamping = true;

    controls.dampingFactor = 0.08;

    controls.minDistance = 18;

    controls.maxDistance = 190;

    controls.maxPolarAngle =
      Math.PI * 0.47;

    controls.minPolarAngle =
      0.28;

    controls.target.set(
      0,
      0,
      20
    );


    /* =====================================================
       LIGHTING
       ===================================================== */

    const ambientLight =
      new THREE.HemisphereLight(
        0xdceeff,
        0x66705d,
        2.15
      );

    scene.add(
      ambientLight
    );


    const sun =
      new THREE.DirectionalLight(
        0xfff5df,
        3.2
      );

    sun.position.set(
      90,
      140,
      70
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;

    sun.shadow.mapSize.height = 2048;

    sun.shadow.camera.left = -180;

    sun.shadow.camera.right = 180;

    sun.shadow.camera.top = 180;

    sun.shadow.camera.bottom = -180;

    sun.shadow.camera.near = 1;

    sun.shadow.camera.far = 450;

    scene.add(
      sun
    );


    const fillLight =
      new THREE.DirectionalLight(
        0xb9d9ff,
        0.65
      );

    fillLight.position.set(
      -80,
      70,
      -90
    );

    scene.add(
      fillLight
    );


    /* =====================================================
       MATERIAL SYSTEM
       ===================================================== */

    const MATERIALS = {

      grass:
        new THREE.MeshStandardMaterial({
          color: 0x6f9b63,
          roughness: 1
        }),

      grassLight:
        new THREE.MeshStandardMaterial({
          color: 0x86ad72,
          roughness: 1
        }),

      asphalt:
        new THREE.MeshStandardMaterial({
          color: 0x343a40,
          roughness: 0.94
        }),

      asphaltLight:
        new THREE.MeshStandardMaterial({
          color: 0x4a5055,
          roughness: 0.92
        }),

      sidewalk:
        new THREE.MeshStandardMaterial({
          color: 0xb7b8b2,
          roughness: 0.9
        }),

      sidewalkLight:
        new THREE.MeshStandardMaterial({
          color: 0xd1d0c9,
          roughness: 0.86
        }),

      concrete:
        new THREE.MeshStandardMaterial({
          color: 0xa8aaa7,
          roughness: 0.9
        }),

      floor:
        new THREE.MeshStandardMaterial({
          color: 0xc7b99e,
          roughness: 0.72
        }),

      wall:
        new THREE.MeshStandardMaterial({
          color: 0xe8e3d8,
          roughness: 0.78
        }),

      wallDark:
        new THREE.MeshStandardMaterial({
          color: 0x414852,
          roughness: 0.72
        }),

      glass:
        new THREE.MeshPhysicalMaterial({
          color: 0x8bbbd4,
          metalness: 0.05,
          roughness: 0.12,
          transmission: 0.18,
          transparent: true,
          opacity: 0.58
        }),

      glassDark:
        new THREE.MeshPhysicalMaterial({
          color: 0x304d62,
          metalness: 0.2,
          roughness: 0.18,
          transmission: 0.08,
          transparent: true,
          opacity: 0.76
        }),

      metal:
        new THREE.MeshStandardMaterial({
          color: 0x50555b,
          metalness: 0.72,
          roughness: 0.3
        }),

      white:
        new THREE.MeshStandardMaterial({
          color: 0xf4f4ef,
          roughness: 0.72
        }),

      dark:
        new THREE.MeshStandardMaterial({
          color: 0x20252b,
          roughness: 0.68
        }),

      wood:
        new THREE.MeshStandardMaterial({
          color: 0x765438,
          roughness: 0.68
        }),

      woodLight:
        new THREE.MeshStandardMaterial({
          color: 0xb48757,
          roughness: 0.7
        }),

      green:
        new THREE.MeshStandardMaterial({
          color: 0x3e7947,
          roughness: 0.94
        }),

      treeTrunk:
        new THREE.MeshStandardMaterial({
          color: 0x60442f,
          roughness: 1
        }),

      treeLeaf:
        new THREE.MeshStandardMaterial({
          color: 0x3f7c47,
          roughness: 0.95
        }),

      roadLine:
        new THREE.MeshBasicMaterial({
          color: 0xe6d27a
        }),

      whiteLine:
        new THREE.MeshBasicMaterial({
          color: 0xf2f2e9
        }),

      red:
        new THREE.MeshStandardMaterial({
          color: 0xb7473e,
          roughness: 0.62
        }),

      blue:
        new THREE.MeshStandardMaterial({
          color: 0x356da8,
          roughness: 0.62
        }),

      yellow:
        new THREE.MeshStandardMaterial({
          color: 0xd4a72c,
          roughness: 0.66
        }),

      orange:
        new THREE.MeshStandardMaterial({
          color: 0xc87532,
          roughness: 0.67
        })

    };


    /* =====================================================
       WORLD ROOTS
       ===================================================== */

    const WORLD =
      new THREE.Group();

    WORLD.name =
      "EmpireRushWorld";

    scene.add(
      WORLD
    );


    const CITY =
      new THREE.Group();

    CITY.name =
      "City";

    WORLD.add(
      CITY
    );


    const ROADS =
      new THREE.Group();

    ROADS.name =
      "RoadNetwork";

    CITY.add(
      ROADS
    );


    const BUILDINGS =
      new THREE.Group();

    BUILDINGS.name =
      "Buildings";

    CITY.add(
      BUILDINGS
    );


    const PROPERTIES =
      new THREE.Group();

    PROPERTIES.name =
      "Properties";

    WORLD.add(
      PROPERTIES
    );


    const HQ =
      new THREE.Group();

    HQ.name =
      "PlayerHQ";

    PROPERTIES.add(
      HQ
    );


    const HQ_INTERIOR =
      new THREE.Group();

    HQ_INTERIOR.name =
      "HQInterior";

    HQ.add(
      HQ_INTERIOR
    );


    const NPC_ROOT =
      new THREE.Group();

    NPC_ROOT.name =
      "Employees";

    WORLD.add(
      NPC_ROOT
    );


    const TRAFFIC_ROOT =
      new THREE.Group();

    TRAFFIC_ROOT.name =
      "Traffic";

    WORLD.add(
      TRAFFIC_ROOT
    );


    const PARK_ROOT =
      new THREE.Group();

    PARK_ROOT.name =
      "Parks";

    CITY.add(
      PARK_ROOT
    );


    /* =====================================================
       WORLD CONSTANTS
       ===================================================== */

    const WORLD_SIZE =
      420;

    const ROAD_WIDTH =
      10;

    const SIDEWALK_WIDTH =
      2.4;


    /* =====================================================
       HELPER FUNCTIONS
       ===================================================== */

    function addMesh(
      geometry,
      material,
      parent,
      x = 0,
      y = 0,
      z = 0
    ) {

      const mesh =
        new THREE.Mesh(
          geometry,
          material
        );

      mesh.position.set(
        x,
        y,
        z
      );

      mesh.castShadow = true;

      mesh.receiveShadow = true;

      parent.add(
        mesh
      );

      return mesh;
    }


    function box(
      width,
      height,
      depth,
      material,
      parent,
      x = 0,
      y = 0,
      z = 0
    ) {

      return addMesh(
        new THREE.BoxGeometry(
          width,
          height,
          depth
        ),
        material,
        parent,
        x,
        y,
        z
      );
    }


    function cylinder(
      radiusTop,
      radiusBottom,
      height,
      material,
      parent,
      x = 0,
      y = 0,
      z = 0,
      radialSegments = 16
    ) {

      return addMesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          radialSegments
        ),
        material,
        parent,
        x,
        y,
        z
      );
    }


    function plane(
      width,
      depth,
      material,
      parent,
      x = 0,
      y = 0,
      z = 0
    ) {

      const mesh =
        addMesh(
          new THREE.PlaneGeometry(
            width,
            depth
          ),
          material,
          parent,
          x,
          y,
          z
        );

      mesh.rotation.x =
        -Math.PI / 2;

      return mesh;
    }


    function roundedBox(
      width,
      height,
      depth,
      material,
      parent,
      x = 0,
      y = 0,
      z = 0
    ) {

      /*
       * Deliberately kept dependency-free.
       * The city can therefore render even if an optional
       * geometry helper fails.
       */

      return box(
        width,
        height,
        depth,
        material,
        parent,
        x,
        y,
        z
      );
    }


    /* =====================================================
       GLOBAL GROUND
       ===================================================== */

    const ground =
      plane(
        WORLD_SIZE,
        WORLD_SIZE,
        MATERIALS.grass,
        WORLD,
        0,
        0,
        0
      );

    ground.name =
      "CityGround";


    /* =====================================================
       WORLD DATA OBJECT
       ===================================================== */

    const WORLD_DATA = {

      roads: [],

      properties: [],

      buildings: [],

      parks: [],

      workers: [],

      traffic: [],

      pedestrians: []

    };


    /* =====================================================
       EMPLOYEE DATA
       ===================================================== */

    const EMPLOYEE_DATA = {

      Aarav: {
        salary: 42000,
        performance: 86,
        experience: 4,
        morale: 82,
        status: "Working",
        role: "Operations Manager"
      },

      Riya: {
        salary: 38000,
        performance: 91,
        experience: 3,
        morale: 88,
        status: "Working",
        role: "Finance Manager"
      },

      Kabir: {
        salary: 35000,
        performance: 79,
        experience: 5,
        morale: 74,
        status: "Working",
        role: "Sales Executive"
      },

      Anaya: {
        salary: 33000,
        performance: 89,
        experience: 2,
        morale: 86,
        status: "Working",
        role: "HR Executive"
      },

      Vivaan: {
        salary: 46000,
        performance: 94,
        experience: 6,
        morale: 91,
        status: "Working",
        role: "Technology Lead"
      },

      Meera: {
        salary: 41000,
        performance: 87,
        experience: 4,
        morale: 84,
        status: "Working",
        role: "Marketing Manager"
      },

      Arjun: {
        salary: 30000,
        performance: 76,
        experience: 2,
        morale: 78,
        status: "Working",
        role: "Business Executive"
      },

      Ishita: {
        salary: 37000,
        performance: 90,
        experience: 3,
        morale: 89,
        status: "Working",
        role: "Product Manager"
      }

    };


    /* =====================================================
       EMPLOYEE PANEL
       ===================================================== */

    function formatMoney(value) {

      const number =
        Number(value) || 0;

      return "₹" +
        number.toLocaleString(
          "en-IN"
        );
    }


    function showEmployee(
      employee
    ) {

      if (!employee) {
        return;
      }

      const data =
        EMPLOYEE_DATA[
          employee.name
        ] ||
        employee;

      document.getElementById(
        "employeeName"
      ).textContent =
        employee.name ||
        "Employee";

      document.getElementById(
        "employeeRole"
      ).textContent =
        data.role ||
        employee.role ||
        "Employee";

      document.getElementById(
        "employeeSalary"
      ).textContent =
        formatMoney(
          data.salary
        );

      document.getElementById(
        "employeePerformance"
      ).textContent =
        `${data.performance ?? 0}%`;

      document.getElementById(
        "employeeExperience"
      ).textContent =
        `${data.experience ?? 0} years`;

      document.getElementById(
        "employeeMorale"
      ).textContent =
        `${data.morale ?? 0}%`;

      document.getElementById(
        "employeeStatus"
      ).textContent =
        data.status ||
        "Working";

      EMPLOYEE_PANEL.classList.add(
        "visible"
      );
    }


    function hideEmployee() {

      EMPLOYEE_PANEL.classList.remove(
        "visible"
      );
    }


    EMPLOYEE_CLOSE.addEventListener(
      "click",
      hideEmployee
    );


    /* =====================================================
       LOADING HELPER
       ===================================================== */

    function finishLoading() {

      setTimeout(
        () => {

          LOADING.classList.add(
            "hidden"
          );

        },
        350
      );

    }


    /* =====================================================
       NEXT PART CONTINUES FROM HERE
       ===================================================== */
      /* =====================================================
       ROAD SYSTEM
       ===================================================== */

    function createRoad(
      x,
      z,
      width,
      depth,
      orientation = "horizontal"
    ) {

      const roadGroup =
        new THREE.Group();

      roadGroup.name =
        `Road_${orientation}_${x}_${z}`;

      ROADS.add(
        roadGroup
      );

      let road;

      if (orientation === "horizontal") {

        road =
          box(
            depth,
            0.16,
            width,
            MATERIALS.asphalt,
            roadGroup,
            0,
            0.08,
            0
          );

      } else {

        road =
          box(
            width,
            0.16,
            depth,
            MATERIALS.asphalt,
            roadGroup,
            0,
            0.08,
            0
          );
      }

      road.castShadow = false;

      road.receiveShadow = true;


      /* ---------------------------------------------------
         Sidewalks
         --------------------------------------------------- */

      if (orientation === "horizontal") {

        box(
          depth,
          0.18,
          SIDEWALK_WIDTH,
          MATERIALS.sidewalk,
          roadGroup,
          0,
          0.17,
          -(width / 2 + SIDEWALK_WIDTH / 2)
        );

        box(
          depth,
          0.18,
          SIDEWALK_WIDTH,
          MATERIALS.sidewalk,
          roadGroup,
          0,
          0.17,
          width / 2 + SIDEWALK_WIDTH / 2
        );

      } else {

        box(
          SIDEWALK_WIDTH,
          0.18,
          depth,
          MATERIALS.sidewalk,
          roadGroup,
          -(width / 2 + SIDEWALK_WIDTH / 2),
          0.17,
          0
        );

        box(
          SIDEWALK_WIDTH,
          0.18,
          depth,
          MATERIALS.sidewalk,
          roadGroup,
          width / 2 + SIDEWALK_WIDTH / 2,
          0.17,
          0
        );
      }


      /* ---------------------------------------------------
         Road centre markings
         --------------------------------------------------- */

      const markingLength = 4.2;
      const gap = 5.5;

      if (orientation === "horizontal") {

        for (
          let p = -depth / 2 + 4;
          p < depth / 2 - 2;
          p += markingLength + gap
        ) {

          box(
            markingLength,
            0.025,
            0.18,
            MATERIALS.roadLine,
            roadGroup,
            p,
            0.18,
            0
          );
        }

      } else {

        for (
          let p = -depth / 2 + 4;
          p < depth / 2 - 2;
          p += markingLength + gap
        ) {

          box(
            0.18,
            0.025,
            markingLength,
            MATERIALS.roadLine,
            roadGroup,
            0,
            0.18,
            p
          );
        }
      }


      WORLD_DATA.roads.push({
        x,
        z,
        width,
        depth,
        orientation,
        group: roadGroup
      });

      return roadGroup;
    }


    /* =====================================================
       CROSSWALK
       ===================================================== */

    function createCrosswalk(
      x,
      z,
      orientation = "horizontal"
    ) {

      const group =
        new THREE.Group();

      group.name =
        "Crosswalk";

      ROADS.add(
        group
      );

      const stripeCount = 7;

      for (
        let i = 0;
        i < stripeCount;
        i++
      ) {

        if (orientation === "horizontal") {

          box(
            1.1,
            0.035,
            6.2,
            MATERIALS.whiteLine,
            group,
            x - 4.2 + i * 1.4,
            0.205,
            z
          );

        } else {

          box(
            6.2,
            0.035,
            1.1,
            MATERIALS.whiteLine,
            group,
            x,
            0.205,
            z - 4.2 + i * 1.4
          );
        }
      }

      return group;
    }


    /* =====================================================
       CITY ROAD GRID
       ===================================================== */

    createRoad(
      0,
      18,
      ROAD_WIDTH,
      390,
      "horizontal"

    /* =====================================================

       ===================================================== */

    function createTextSprite(
      text,
      options = {}
    ) {

      const {

        fontSize = 42,

        color = "#ffffff",

        background = "transparent",

        padding = 12

      } = options;


      const canvas =
        document.createElement(
          "canvas"
        );

      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.font =
        `800 ${fontSize}px Arial`;

      const metrics =
        ctx.measureText(
          text
        );

      const width =
        Math.ceil(
          metrics.width +
          padding * 2
        );

      const height =
        Math.ceil(
          fontSize +
          padding * 2
        );


      canvas.width =
        width;

      canvas.height =
        height;


      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      if (
        background !==
        "transparent"
      ) {

        ctx.fillStyle =
          background;

        ctx.fillRect(
          0,
          0,
          width,
          height
        );
      }


      ctx.font =
        `800 ${fontSize}px Arial`;

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";

      ctx.fillStyle =
        color;

      ctx.fillText(
        text,
        width / 2,
        height / 2
      );


      const texture =
        new THREE.CanvasTexture(
          canvas
        );

      texture.colorSpace =
        THREE.SRGBColorSpace;

      texture.needsUpdate =
        true;


      const material =
        new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthWrite: false
        });


      const sprite =
        new THREE.Sprite(
          material
        );


      sprite.scale.set(
        width / 45,
        height / 45,
        1
      );


      return sprite;
    }

    function createBuilding(
      options = {}
    ) {

      const {

        name = "City Building",

        type = "commercial",

        x = 0,

        z = 0,

        width = 14,

        depth = 14,

        height = 10,

        bodyMaterial = MATERIALS.wall,

        accentMaterial = MATERIALS.wallDark,

        floors = 2,

        sign = ""

      } = options;


      const building =
        new THREE.Group();

      building.name =
        name;

      building.position.set(
        x,
        0,
        z
      );

      BUILDINGS.add(
        building
      );


      /* ---------------------------------------------------
         Main structure
         --------------------------------------------------- */

      box(
        width,
        height,
        depth,
        bodyMaterial,
        building,
        0,
        height / 2,
        0
      );


      /* ---------------------------------------------------
         Base
         --------------------------------------------------- */

      box(
        width + 0.8,
        0.6,
        depth + 0.8,
        accentMaterial,
        building,
        0,
        0.3,
        0
      );


      /* ---------------------------------------------------
         Roof
         --------------------------------------------------- */

      box(
        width + 0.8,
        0.7,
        depth + 0.8,
        accentMaterial,
        building,
        0,
        height + 0.35,
        0
      );


      /* ---------------------------------------------------
         Windows
         --------------------------------------------------- */

      const windowMaterial =
        MATERIALS.glass;


      const floorHeight =
        height / Math.max(
          floors,
          1
        );


      const windowRows =
        Math.max(
          floors,
          1
        );


      const columns =
        Math.max(
          2,
          Math.floor(
            width / 3
          )
        );


      for (
        let row = 0;
        row < windowRows;
        row++
      ) {

        const y =
          floorHeight *
            row +
          floorHeight *
            0.56;


        for (
          let col = 0;
          col < columns;
          col++
        ) {

          const spacing =
            width /
            (columns + 1);

          const windowX =
            -width / 2 +
            spacing *
              (col + 1);


          box(
            Math.min(
              1.8,
              spacing * 0.62
            ),
            Math.min(
              2.1,
              floorHeight * 0.46
            ),
            0.18,
            windowMaterial,
            building,
            windowX,
            y,
            -depth / 2 - 0.11
          );


          box(
            Math.min(
              1.8,
              spacing * 0.62
            ),
            Math.min(
              2.1,
              floorHeight * 0.46
            ),
            0.18,
            windowMaterial,
            building,
            windowX,
            y,
            depth / 2 + 0.11
          );
        }
      }


      /* ---------------------------------------------------
         Side windows
         --------------------------------------------------- */

      const sideRows =
        Math.max(
          1,
          floors
        );


      const sideColumns =
        Math.max(
          2,
          Math.floor(
            depth / 3.5
          )
        );


      for (
        let row = 0;
        row < sideRows;
        row++
      ) {

        const y =
          floorHeight *
            row +
          floorHeight *
            0.56;


        for (
          let col = 0;
          col < sideColumns;
          col++
        ) {

          const spacing =
            depth /
            (sideColumns + 1);

          const windowZ =
            -depth / 2 +
            spacing *
              (col + 1);


          box(
            0.18,
            Math.min(
              2.0,
              floorHeight * 0.46
            ),
            Math.min(
              1.6,
              spacing * 0.58
            ),
            windowMaterial,
            building,
            -width / 2 - 0.11,
            y,
            windowZ
          );


          box(
            0.18,
            Math.min(
              2.0,
              floorHeight * 0.46
            ),
            Math.min(
              1.6,
              spacing * 0.58
            ),
            windowMaterial,
            building,
            width / 2 + 0.11,
            y,
            windowZ
          );
        }
      }


      /* ---------------------------------------------------
         Ground-level entrance
         --------------------------------------------------- */

      box(
        Math.min(
          3.5,
          width * 0.35
        ),
        Math.min(
          4.2,
          height * 0.38
        ),
        0.24,
        MATERIALS.glassDark,
        building,
        0,
        Math.min(
          2.2,
          height * 0.2
        ),
        -depth / 2 - 0.14
      );


      /* ---------------------------------------------------
         Sign
         --------------------------------------------------- */

      if (sign) {

        const signSprite =
          createTextSprite(
            sign,
            {
              fontSize: 28,
              color: "#ffffff",
              background:
                "rgba(20,28,38,0.78)"
            }
          );


        signSprite.position.set(
          0,
          height * 0.72,
          -depth / 2 - 0.35
        );


        signSprite.scale.multiplyScalar(
          0.11
        );


        building.add(
          signSprite
        );
      }


      WORLD_DATA.buildings.push({
        name,
        type,
        x,
        z,
        width,
        depth,
        height,
        floors,
        group: building
      });


      return building;
    }

    /* =====================================================
       EMPLOYEE MOVEMENT
       ===================================================== */

    function moveHumanTo(
      human,
      targetX,
      targetZ,
      duration = 900
    ) {

      if (
        !human
      ) {
        return;
      }


      const startX =
        human.position.x;

      const startZ =
        human.position.z;


      const startTime =
        performance.now();


      human.userData.moving =
        true;


      human.userData.moveAnimation =
        {

          startX,

          startZ,

          targetX,

          targetZ,

          startTime,

          duration

        };

    }


    function updateEmployeeMovement(
      now
    ) {

      WORLD_DATA.workers.forEach(
        human => {

          const animation =
            human.userData.moveAnimation;


          if (
            !animation
          ) {
            return;
          }


          const elapsed =
            now -
            animation.startTime;


          const progress =
            Math.min(
              elapsed /
              animation.duration,
              1
            );


          const eased =
            progress *
            progress *
            (
              3 -
              2 *
              progress
            );


          human.position.x =
            THREE.MathUtils.lerp(
              animation.startX,
              animation.targetX,
              eased
            );


          human.position.z =
            THREE.MathUtils.lerp(
              animation.startZ,
              animation.targetZ,
              eased
            );


          const dx =
            animation.targetX -
            animation.startX;


          const dz =
            animation.targetZ -
            animation.startZ;


          if (
            Math.abs(dx) +
            Math.abs(dz) >
            0.01
          ) {

            human.rotation.y =
              Math.atan2(
                dx,
                dz
              );

          }


          if (
            progress >= 1
          ) {

            human.userData.moveAnimation =
              null;

            human.userData.moving =
              false;

          }

        }
      );

    }

    /* =====================================================
       EMPLOYEE SELECTION
       ===================================================== */

    const raycaster =
      new THREE.Raycaster();


    const pointer =
      new THREE.Vector2();


    function selectEmployeeAt(
      clientX,
      clientY
    ) {

      const rect =
        renderer.domElement.getBoundingClientRect();


      pointer.x =
        (
          (clientX - rect.left) /
          rect.width
        ) * 2 - 1;


      pointer.y =
        -(
          (clientY - rect.top) /
          rect.height
        ) * 2 + 1;


      raycaster.setFromCamera(
        pointer,
        camera
      );


      const intersections =
        raycaster.intersectObjects(
          NPC_ROOT.children,
          true
        );


      if (
        !intersections.length
      ) {

        return;

      }


      let selected =
        intersections[0].object;


      while (
        selected &&
        selected.parent !==
          NPC_ROOT
      ) {

        selected =
          selected.parent;

      }


      if (
        !selected ||
        selected.parent !==
          NPC_ROOT
      ) {

        return;

      }


      const name =
        selected.userData.employeeName;


      if (
        !name
      ) {

        return;

      }


      const employee =
        {
          name,
          ...(
            EMPLOYEE_DATA[name] ||
            {}
          )
        };


      showEmployee(
        employee
      );


      window.dispatchEvent(
        new CustomEvent(
          "EmpireEmployeeSelected",
          {
            detail:
              employee
          }
        )
      );


      focusOn(
        selected.position.x,
        selected.position.z
      );

    }


    renderer.domElement.addEventListener(
      "pointerdown",
      event => {

        /*
         * Ignore right mouse button.
         * Touch and left-click both work.
         */

        if (
          event.button !== undefined &&
          event.button !== 0
        ) {

          return;

        }


        selectEmployeeAt(
          event.clientX,
          event.clientY
        );

      }

    /* =====================================================
       MOVE EMPLOYEE PUBLIC API
       ===================================================== */

    function moveWorkerTo(
      worker,
      x,
      z
    ) {

      let object =
        worker;


      if (
        typeof worker ===
        "string"
      ) {

        object =
          WORLD_DATA.workers.find(
            item =>
              item.userData
                ?.employeeName ===
              worker
          );

      }


      if (
        !object
      ) {

        return false;

      }


      moveHumanTo(
        object,
        x,
        z
      );


      return true;
    }


    /* =====================================================
       PART 5 COMPLETE
       ===================================================== */
      /* =====================================================
       TRAFFIC UPDATE
       ===================================================== */

    function updateTraffic(
      delta
    ) {

      WORLD_DATA.traffic.forEach(
        vehicle => {

          const object =
            vehicle.object;


          if (
            !object
          ) {
            return;
          }


          const movement =
            vehicle.speed *
            delta *
            60 *
            vehicle.direction;


          if (
            vehicle.axis === "x"
          ) {

            object.position.x +=
              movement;


            if (
              object.position.x >
              195
            ) {

              object.position.x =
                -195;

            }


            if (
              object.position.x <
              -195
            ) {

              object.position.x =
                195;

            }

          } else {

            object.position.z +=
              movement;


            if (
              object.position.z >
              195
            ) {

              object.position.z =
                -195;

            }


            if (
              object.position.z <
              -195
            ) {

              object.position.z =
                195;

            }

          }

        }
      );

    }


    /* =====================================================
       PEDESTRIAN SYSTEM
       ===================================================== */

    function createPedestrian(
      x,
      z,
      targetX,
      targetZ

      const pedestrian =
        createFallbackHuman(
          NPC_ROOT,
          0x667085

      pedestrian.name =
        "CityPedestrian";


      pedestrian.position.set(
        x,
        0,
        z
      );


      pedestrian.userData.cityPedestrian =
        true;


      pedestrian.userData.walkTarget = {

        x:
          targetX,

        z:
          targetZ

      };


      pedestrian.scale.setScalar(
        0.78
      );


      WORLD_DATA.pedestrians.push(
        pedestrian
      );


      return pedestrian;
    }


    /* -----------------------------------------------------
       Pedestrian positions are kept on sidewalks/parks.
       They do NOT walk through buildings.
       ----------------------------------------------------- */

    /* =====================================================
       PEDESTRIAN UPDATE
       ===================================================== */

    function updatePedestrians(
      delta
    ) {

      WORLD_DATA.pedestrians.forEach(
        pedestrian => {

          if (
            !pedestrian.userData
              .walkTarget
          ) {

            return;

          }


          const target =
            pedestrian.userData
              .walkTarget;


          const dx =
            target.x -
            pedestrian.position.x;


          const dz =
            target.z -
            pedestrian.position.z;


          const distance =
            Math.sqrt(
              dx * dx +
              dz * dz
            );


          if (
            distance <
            0.8
          ) {

            pedestrian.userData
              .walkTarget = {

                x:
                  -target.x,

                z:
                  -target.z

              };

            return;

          }


          const speed =
            0.9 *
            delta;


          pedestrian.position.x +=
            (dx / distance) *
            speed;


          pedestrian.position.z +=
            (dz / distance) *
            speed;


          pedestrian.rotation.y =
            Math.atan2(
              dx,
              dz
            );

        }
      );

    }

      76,
      102
    );

    /* =====================================================
       ANIMATION CLOCK
       ===================================================== */

    const clock =
      new THREE.Clock();


    let lastTime =
      performance.now();


    /* =====================================================
       MAIN RENDER LOOP
       ===================================================== */

    function animate(
      now
    ) {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );


      updateTraffic(
        delta
      );


      updatePedestrians(
        delta
      );


      updateEmployeeMovement(
        now
      );


      controls.update();


      renderer.render(
        scene,
        camera
      );


      lastTime =
        now;

    }


    /* =====================================================
       RESPONSIVE RESIZE
       ===================================================== */

    function resizeRenderer() {

      const width =
        window.innerWidth;

      const height =
        window.innerHeight;


      if (
        width <= 0 ||
        height <= 0
      ) {

        return;

      }


      camera.aspect =
        width / height;


      camera.updateProjectionMatrix();


      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio || 1,
          2
        )
      );


      renderer.setSize(
        width,
        height,
        false
      );

    }


    window.addEventListener(
      "resize",
      resizeRenderer
    );


    window.addEventListener(
      "orientationchange",
      () => {

        setTimeout(
          resizeRenderer,
          100
        );

      }
    );


    /* =====================================================
       INITIALIZE
       ===================================================== */

    resizeRenderer();

    finishLoading();

    requestAnimationFrame(
      animate
    );


    /* =====================================================

       ===================================================== */

    console.log(

    console.log(
      "Traffic:",
      WORLD_DATA.traffic.length
    );

    console.log(
      "Pedestrians:",
      WORLD_DATA.pedestrians.length
    );


  </script>
