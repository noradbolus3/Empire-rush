/* =====================================================
   LOAD HUMAN MODEL
===================================================== */

function loadHumanModel(){

  if(humanLoading.started){
    return;
  }

  humanLoading.started = true;


  humanLoader.load(

    HUMAN_MODEL_URL,

    function(gltf){

      console.log(
        "REAL HUMAN MODEL LOADED"
      );


      humanTemplate =
        gltf.scene;


      humanAnimations =
        gltf.animations || [];


      humanTemplate.traverse(
        function(object){

          if(!object.isMesh){
            return;
          }

          object.castShadow = true;
          object.receiveShadow = true;


          if(object.material){

            object.material.side =
              THREE.FrontSide;

            object.material.needsUpdate =
              true;

          }

        }
      );


      humanLoading.loaded = true;


      spawnAllEmployees();

    },


    function(progress){

      if(progress.total){

        console.log(
          "Human loading:",
          Math.round(
            progress.loaded /
            progress.total *
            100
          ) + "%"
        );

      }

    },


    function(error){

      humanLoading.failed = true;

      console.error(
        "REAL HUMAN MODEL FAILED",
        error
      );

    }

  );

}


/* =====================================================
   FIND ANIMATION
===================================================== */

function findHumanAnimation(
  keywords
){

  if(!humanAnimations.length){
    return null;
  }


  const lower =
    keywords.map(
      x => x.toLowerCase()
    );


  return humanAnimations.find(
    clip => {

      const name =
        clip.name.toLowerCase();

      return lower.some(
        key => name.includes(key)
      );

    }
  ) || null;

}


/* =====================================================
   CREATE HUMAN
===================================================== */

function createRealHuman(
  employee
){

  if(!humanTemplate){
    return null;
  }


  const human =
    SkeletonUtils.clone(
      humanTemplate
    );


  human.position.set(
    employee.x,
    0.05,
    employee.z
  );


  human.scale.setScalar(
    employee.scale || 1
  );


  human.traverse(
    function(object){

      if(!object.isMesh){
        return;
      }

      object.castShadow = true;
      object.receiveShadow = true;

      if(object.material){
        object.material.needsUpdate = true;
      }

    }
  );


  human.userData = {

    name:employee.name,

    role:employee.role,

    dept:employee.dept,

    gender:employee.gender,

    status:"Working",

    homeX:employee.x,

    homeZ:employee.z,

    targetX:null,

    targetZ:null,

    speed:
      0.9 +
      Math.random() * 0.35

  };


  const mixer =
    new THREE.AnimationMixer(
      human
    );


  human.userData.mixer =
    mixer;


  const idleClip =
    findHumanAnimation([
      "idle",
      "standing",
      "stand"
    ]);


  const walkClip =
    findHumanAnimation([
      "walk",
      "walking",
      "locomotion"
    ]);


  const runClip =
    findHumanAnimation([
      "run",
      "running"
    ]);


  const actions = {};


  if(idleClip){

    actions.idle =
      mixer.clipAction(
        idleClip
      );

    actions.idle.play();

  }


  if(walkClip){

    actions.walk =
      mixer.clipAction(
        walkClip
      );

  }


  if(runClip){

    actions.run =
      mixer.clipAction(
        runClip
      );

  }


  human.userData.actions =
    actions;


  human.userData.currentAction =
    "idle";


  scene.add(human);

  workers.push(human);

  humanMixers.push(mixer);


  return human;

}


/* =====================================================
   HUMAN ANIMATION
===================================================== */

function playHumanAnimation(
  human,
  name
){

  if(!human){
    return;
  }


  const actions =
    human.userData.actions;


  if(!actions){
    return;
  }


  const next =
    actions[name];


  if(!next){
    return;
  }


  const current =
    actions[
      human.userData.currentAction
    ];


  if(current === next){
    return;
  }


  if(current){
    current.fadeOut(0.25);
  }


  next.reset();

  next.fadeIn(0.25);

  next.play();


  human.userData.currentAction =
    name;

}

function moveHumanTo(
  human,
  x,
  z,
  status = "Walking"
){

  if(!human){
    return;
  }


  human.userData.targetX = x;

  human.userData.targetZ = z;

  human.userData.status = status;


  playHumanAnimation(
    human,
    "walk"
  );

}


/* =====================================================
   UPDATE HUMANS
===================================================== */

function updateHumans(
  delta
){

  humanMixers.forEach(
    mixer => {

      mixer.update(delta);

    }
  );


  workers.forEach(
    human => {

      const d =
        human.userData;


      if(
        d.targetX === null ||
        d.targetZ === null
      ){

        return;

      }


      const dx =
        d.targetX -
        human.position.x;


      const dz =
        d.targetZ -
        human.position.z;


      const distance =
        Math.sqrt(
          dx * dx +
          dz * dz
        );


      if(distance < 0.15){

        human.position.x =
          d.targetX;

        human.position.z =
          d.targetZ;


        d.targetX = null;

        d.targetZ = null;

        d.status = "Working";


        playHumanAnimation(
          human,
          "idle"
        );


        return;

      }


      const targetRotation =
        Math.atan2(
          dx,
          dz
        );


      let difference =
        targetRotation -
        human.rotation.y;


      while(
        difference > Math.PI
      ){

        difference -=
          Math.PI * 2;

      }


      while(
        difference < -Math.PI
      ){

        difference +=
          Math.PI * 2;

      }


      human.rotation.y +=
        difference *
        Math.min(
          delta * 8,
          1
        );


      const speed =
        d.speed * delta;


      human.position.x +=
        Math.sin(
          human.rotation.y
        ) * speed;


      human.position.z +=
        Math.cos(
          human.rotation.y
        ) * speed;

    }
  );

}

function car(
  x,
  z,
  scale = 1
){

  const group =
    new THREE.Group();


  group.position.set(
    x,
    0.4,
    z
  );


  group.scale.setScalar(
    scale
  );


  cube(
    2.4,
    0.55,
    1.2,
    black,
    0,
    0.35,
    0,
    group
  );


  cube(
    1.3,
    0.55,
    1,
    blueGlass,
    0,
    0.75,
    0,
    group
  );


  for(
    const px of [-0.85,0.85]
  ){

    const wheel =
      cyl(
        0.3,
        0.18,
        black,
        px,
        0.02,
        -0.68,
        group
      );


    wheel.rotation.x =
      Math.PI / 2;


    const wheel2 =
      wheel.clone();


    wheel2.position.z =
      0.68;


    group.add(wheel2);

  }


  scene.add(group);

}

function city(
  x,
  z,
  w,
  h,
  d
){

  cube(
    w,
    h,
    d,
    mat(0x9da7ac),
    x,
    h / 2,
    z
  );


  for(
    let y = 2;
    y < h - 1;
    y += 2.5
  ){

    for(
      let xx = x - w / 2 + 1;
      xx < x + w / 2 - 1;
      xx += 2
    ){

      cube(
        0.65,
        0.65,
        0.04,
        blueGlass,
        xx,
        y,
        z - d / 2 - 0.03
      );

    }

  }

}

/* =====================================================
   EMPLOYEE RAYCAST
===================================================== */

const ray =
  new THREE.Raycaster();

const pointer =
  new THREE.Vector2();


function inspect(
  x,
  y
){

  const rect =
    canvas.getBoundingClientRect();


  pointer.x =
    ((x - rect.left) / rect.width) * 2 - 1;


  pointer.y =
    -((y - rect.top) / rect.height) * 2 + 1;


  ray.setFromCamera(
    pointer,
    camera
  );


  const hits =
    ray.intersectObjects(
      workers,
      true
    );


  if(!hits.length){
    return;
  }


  let object =
    hits[0].object;


  while(
    object.parent &&
    !object.userData.name
  ){

    object =
      object.parent;

  }


  if(!object.userData.name){
    return;
  }


  const employee =
    object.userData;


  window.dispatchEvent(
    new CustomEvent(
      "EmpireEmployeeSelected",
      {
        detail:employee
      }
    )
  );


  document.getElementById(
    "ename"
  ).textContent =
    employee.name;


  document.getElementById(
    "erole"
  ).textContent =
    "Role: " + employee.role;


  document.getElementById(
    "edept"
  ).textContent =
    "Department: " + employee.dept;


  document.getElementById(
    "estatus"
  ).textContent =
    "Status: " +
    (employee.status || "Working");


  document.getElementById(
    "employeePanel"
  ).style.display =
    "block";

}


/* =====================================================
   TAP DETECTION
===================================================== */

let downX = 0;

let downY = 0;


canvas.addEventListener(
  "pointerdown",
  function(event){

    downX =
      event.clientX;

    downY =
      event.clientY;

  }
);


canvas.addEventListener(
  "pointerup",
  function(event){

    const dx =
      event.clientX -
      downX;


    const dy =
      event.clientY -
      downY;


    if(
      Math.sqrt(
        dx * dx +
        dy * dy
      ) < 8
    ){

      inspect(
        event.clientX,
        event.clientY
      );

    }

  }
);

}
