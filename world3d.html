<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Empire Rush 3D</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101318;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  width: 100%;
  height: 100%;
  display: block;
}

#hud {
  position: fixed;
  top: 14px;
  left: 14px;
  right: 14px;
  z-index: 10;
  pointer-events: none;
}

.panel {
  display: inline-block;
  padding: 10px 14px;
  border-radius: 14px;
  background: rgba(15, 18, 24, 0.86);
  color: white;
  box-shadow: 0 6px 25px rgba(0,0,0,.25);
}

.title {
  font-size: 18px;
  font-weight: 700;
}

.sub {
  margin-top: 3px;
  font-size: 12px;
  opacity: .7;
}

#hint {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  color: white;
  background: rgba(15,18,24,.82);
  padding: 9px 14px;
  border-radius: 999px;
  font-size: 12px;
  white-space: nowrap;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">
    <div class="title">EMPIRE RUSH</div>
    <div class="sub">3D BUSINESS WORLD • DAY 1</div>
  </div>
</div>

<div id="hint">
  Drag to rotate • Pinch to zoom • Tap a worker
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const canvas = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xb8c4d6);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(14, 13, 14);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 1.5)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;


/* =========================
   LIGHTING
========================= */

const ambient = new THREE.HemisphereLight(
  0xffffff,
  0x667788,
  2.2
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(10, 20, 8);
sun.castShadow = true;

scene.add(sun);


/* =========================
   GROUND
========================= */

const groundGeometry =
  new THREE.PlaneGeometry(50, 50);

const groundMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x879b7a
  });

const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;

scene.add(ground);


/* =========================
   ROAD
========================= */

function createBox(
  x,
  y,
  z,
  w,
  h,
  d,
  color
) {

  const geometry =
    new THREE.BoxGeometry(w, h, d);

  const material =
    new THREE.MeshStandardMaterial({
      color
    });

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);

  return mesh;
}

createBox(
  0,
  0.02,
  7,
  50,
  0.04,
  5,
  0x4b5057
);


/* =========================
   OFFICE BUILDING
========================= */

createBox(
  0,
  3,
  -1,
  13,
  6,
  9,
  0xe8edf2
);


/* Roof */

createBox(
  0,
  6.25,
  -1,
  13.5,
  .5,
  9.5,
  0x252b35
);


/* Glass windows */

for (let x = -5; x <= 5; x += 2.5) {

  createBox(
    x,
    3.7,
    3.55,
    1.7,
    2,
    .12,
    0x6da4c7
  );

}


/* =========================
   ENTRANCE
========================= */

createBox(
  0,
  1.5,
  3.6,
  3,
  3,
  .2,
  0x263b4a
);


/* =========================
   DESKS
========================= */

function createDesk(x, z) {

  createBox(
    x,
    1.05,
    z,
    1.6,
    .15,
    .8,
    0x754c32
  );

  createBox(
    x - .6,
    .5,
    z,
    .12,
    1,
    .7,
    0x4c3426
  );

  createBox(
    x + .6,
    .5,
    z,
    .12,
    1,
    .7,
    0x4c3426
  );
}

createDesk(-4, -1);
createDesk(0, -1);
createDesk(4, -1);

createDesk(-4, -4);
createDesk(0, -4);
createDesk(4, -4);


/* =========================
   WORKER
========================= */

const workers = [];

function createWorker(
  x,
  z,
  shirtColor
) {

  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(.55, .8, .35),
    new THREE.MeshStandardMaterial({
      color: shirtColor
    })
  );

  body.position.y = 1.25;
  body.castShadow = true;

  group.add(body);


  const head = new THREE.Mesh(
    new THREE.SphereGeometry(.25, 12, 12),
    new THREE.MeshStandardMaterial({
      color: 0xd39a72
    })
  );

  head.position.y = 1.85;
  head.castShadow = true;

  group.add(head);


  group.position.set(
    x,
    0,
    z
  );

  group.userData.baseX = x;
  group.userData.baseZ = z;
  group.userData.phase =
    Math.random() * Math.PI * 2;

  scene.add(group);

  workers.push(group);

  return group;
}


createWorker(-4, -1.9, 0x3467d6);
createWorker(0, -1.9, 0x3b9b63);
createWorker(4, -1.9, 0xc96b42);

createWorker(-4, -4.9, 0x7c55b8);
createWorker(0, -4.9, 0xd08a34);
createWorker(4, -4.9, 0x3c8c9a);


/* =========================
   MEETING TABLE
========================= */

createBox(
  0,
  .8,
  -3,
  4,
  .2,
  1.5,
  0x6a4935
);


/* =========================
   CAMERA CONTROLS
========================= */

let rotation = 0.78;
let distance = 20;

let dragging = false;
let lastX = 0;

canvas.addEventListener(
  "pointerdown",
  event => {

    dragging = true;
    lastX = event.clientX;

  }
);

canvas.addEventListener(
  "pointermove",
  event => {

    if (!dragging) return;

    const dx =
      event.clientX - lastX;

    rotation -= dx * 0.008;

    lastX = event.clientX;

    updateCamera();

  }
);

canvas.addEventListener(
  "pointerup",
  () => {
    dragging = false;
  }
);

canvas.addEventListener(
  "pointercancel",
  () => {
    dragging = false;
  }
);


/* =========================
   ZOOM
========================= */

canvas.addEventListener(
  "wheel",
  event => {

    distance +=
      event.deltaY * 0.01;

    distance =
      Math.max(
        10,
        Math.min(30, distance)
      );

    updateCamera();

  }
);


function updateCamera() {

  camera.position.x =
    Math.sin(rotation) * distance;

  camera.position.z =
    Math.cos(rotation) * distance;

  camera.position.y =
    distance * .72;

  camera.lookAt(
    0,
    1,
    -1
  );

}


/* =========================
   TAP WORKER
========================= */

const raycaster =
  new THREE.Raycaster();

const pointer =
  new THREE.Vector2();

canvas.addEventListener(
  "click",
  event => {

    pointer.x =
      (event.clientX /
      window.innerWidth) * 2 - 1;

    pointer.y =
      -(event.clientY /
      window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(
      pointer,
      camera
    );

    const objects = [];

    workers.forEach(worker => {

      worker.traverse(
        object => {

          if (object.isMesh)
            objects.push(object);

        }
      );

    });

    const hits =
      raycaster.intersectObjects(
        objects
      );

    if (hits.length > 0) {

      const worker =
        hits[0].object.parent;

      worker.scale.set(
        1.15,
        1.15,
        1.15
      );

      setTimeout(() => {

        worker.scale.set(
          1,
          1,
          1
        );

      }, 300);

    }

  }
);


/* =========================
   ANIMATION
========================= */

const clock =
  new THREE.Clock();

function animate() {

  requestAnimationFrame(
    animate
  );

  const time =
    clock.getElapsedTime();

  workers.forEach(
    (worker, index) => {

      worker.position.y =
        Math.sin(
          time * 2 +
          worker.userData.phase
        ) * .025;

      worker.rotation.y =
        Math.sin(
          time * .7 +
          worker.userData.phase
        ) * .08;

    }
  );

  renderer.render(
    scene,
    camera
  );
}


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

updateCamera();
animate();

</script>

</body>
</html>
