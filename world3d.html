<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Empire Rush — Headquarters</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#b9c9d5;
  font-family:Arial,sans-serif;
}

#game{
  width:100%;
  height:100%;
  display:block;
}

#top{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.brand,.stat,.tip,#employeePanel{
  background:rgba(16,20,25,.91);
  color:white;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.brand{
  padding:10px 14px;
  border-radius:13px;
  font-weight:800;
  font-size:14px;
}

.brand span{
  color:#baf02c;
}

.stats{
  display:flex;
  gap:6px;
}

.stat{
  padding:7px 10px;
  border-radius:11px;
  font-size:9px;
}

.stat strong{
  display:block;
  font-size:12px;
  margin-top:2px;
}

.tip{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 13px;
  border-radius:18px;
  font-size:10px;
  white-space:nowrap;
  z-index:10;
  pointer-events:none;
}

#employeePanel{
  display:none;
  position:fixed;
  right:14px;
  bottom:48px;
  width:245px;
  padding:16px;
  border-radius:17px;
  z-index:20;
}

#employeePanel h2{
  margin:0 0 5px;
  font-size:18px;
}

#employeePanel p{
  margin:5px 0;
  color:#b9c0c8;
  font-size:12px;
}

#close{
  position:absolute;
  right:9px;
  top:9px;
  width:26px;
  height:26px;
  border:0;
  border-radius:50%;
  background:#30363e;
  color:#fff;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="top">
  <div class="brand">
    EMPIRE <span>RUSH</span> · HQ
  </div>

  <div class="stats">
    <div class="stat">CASH<strong>₹7.09L</strong></div>
    <div class="stat">DAY<strong>32</strong></div>
  </div>
</div>

<div class="tip">
  Drag = rotate · Pinch = zoom · Tap employee
</div>

<div id="employeePanel">
  <button id="close">×</button>
  <h2 id="ename">Employee</h2>
  <p id="erole"></p>
  <p id="edept"></p>
  <p id="estatus"></p>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

/* =====================================================
   ENGINE
===================================================== */

const canvas=document.getElementById("game");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0xc8d5dc);
scene.fog=new THREE.Fog(0xc8d5dc,55,115);

const camera=new THREE.PerspectiveCamera(
  42,
  innerWidth/innerHeight,
  .1,
  200
);

camera.position.set(25,15,27);

const renderer=new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const controls=new OrbitControls(camera,canvas);

controls.enableDamping=true;
controls.dampingFactor=.065;
controls.minDistance=13;
controls.maxDistance=60;
controls.maxPolarAngle=Math.PI/2.18;
controls.minPolarAngle=.35;
controls.target.set(0,1.8,0);

/* =====================================================
   LIGHT
===================================================== */

scene.add(
  new THREE.HemisphereLight(
    0xf4f8ff,
    0x52616a,
    2.3
  )
);

const sun=new THREE.DirectionalLight(0xffffff,3.2);

sun.position.set(25,38,20);
sun.castShadow=true;

sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-45;
sun.shadow.camera.right=45;
sun.shadow.camera.top=45;
sun.shadow.camera.bottom=-45;

scene.add(sun);

/* =====================================================
   MATERIALS
===================================================== */

function mat(color,rough=.8,metal=0){
  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness:metal
  });
}

const grass=mat(0x668657);
const pavement=mat(0xbcc2c4);
const road=mat(0x252a30);
const wall=mat(0xd8ddde);
const wallDark=mat(0x343a41);
const floor=mat(0x747b80);
const wood=mat(0x79583f);
const metal=mat(0x667079,.35,.7);
const black=mat(0x20252b);
const blueGlass=new THREE.MeshStandardMaterial({
  color:0x69a8bb,
  transparent:true,
  opacity:.55,
  roughness:.12
});
const screen=mat(0x1c6974,.2,.1);
const green=mat(0xb9ef2d,.4,.05);
const skin=mat(0xd69a73);
const shirtBlue=mat(0x365c9e);
const shirtGreen=mat(0x4d8061);
const pants=mat(0x292e35);

/* =====================================================
   HELPERS
===================================================== */

function cube(w,h,d,m,x=0,y=0,z=0,parent=scene){

  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    m
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

function cyl(r,h,m,x=0,y=0,z=0,parent=scene){

  const mesh=new THREE.Mesh(
    new THREE.CylinderGeometry(r,r,h,16),
    m
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

/* =====================================================
   CAMPUS
===================================================== */

cube(110,.4,110,grass,0,-.2,0);

cube(44,.15,32,pavement,0,.03,0);

cube(110,.18,8,road,0,.08,18);

for(let x=-50;x<50;x+=7){
  cube(4,.03,.18,pavement,x,.19,18);
}

/* =====================================================
   HQ FLOOR
===================================================== */

const HQ=new THREE.Group();
scene.add(HQ);
  window.EmpireWorld = {
  scene,
  camera,
  renderer,
  controls,
  HQ
};

window.dispatchEvent(
  new Event("EmpireWorldReady")
);

cube(
  31,3.2,.45,
  wallDark,
  0,1.8,9.7,
  HQ
);

/* =====================================================
   EXTERIOR WALLS
   ROOF INTENTIONALLY REMOVED
===================================================== */

/* back wall */

cube(
  31,3.2,.45,
wallDark,
0,1.8,9.7,
  HQ
);

/* left wall */

cube(
  .45,3.2,20,
  wall,
  -15.25,1.8,0,
  HQ
);

/* right wall */

cube(
  .45,3.2,20,
  wall,
  15.25,1.8,0,
  HQ
);

/* partial front walls */

cube(
  7,3.2,.45,
  wall,
  -12,1.8,-9.7,
  HQ
);

cube(
  7,3.2,.45,
  wall,
  12,1.8,-9.7,
  HQ
);

/* =====================================================
   WINDOWS
===================================================== */

for(let x=-8;x<=8;x+=4){

  cube(
    3.1,
    4.4,
    .08,
    blueGlass,
    x,
    4,
    -9.76,
    HQ
  );

}

/* =====================================================
   RECEPTION
===================================================== */

cube(
  5.5,1.15,1.6,
  wood,
  0,1.05,-7.4,
  HQ
);

cube(
  4.2,.7,.08,
  screen,
  0,1.2,-8.23,
  HQ
);

/* reception sign */

cube(
  5,.7,.12,
  black,
  0,4.8,-9.82,
  HQ
);

cube(
  2.4,.22,.15,
  green,
  0,4.8,-9.91,
  HQ
);

/* =====================================================
   CEO CABIN
===================================================== */

cube(
  8,.12,5,
  wood,
  -9,1.1,4.8,
  HQ
);

cube(
  8,2.5,.12,
  blueGlass,
  -9,2.6,7.25,
  HQ
);

cube(
  2.5,1.2,1.2,
  wood,
  -9,1.7,3.2,
  HQ
);

cube(
  1.8,.8,.08,
  screen,
  -9,2.15,2.58,
  HQ
);

/* CEO chair */

cyl(
  .55,.15,
  black,
  -9,.9,2.0,
  HQ
);

/* =====================================================
   OPEN OFFICE DESKS
===================================================== */

function desk(x,z){

  cube(
    2.8,.16,1.35,
    wood,
    x,1.45,z,
    HQ
  );

  for(const dx of[-1.1,1.1]){
    cube(
      .1,1.35,.1,
      metal,
      x+dx,.75,z,
      HQ
    );
  }

  cube(
    1.15,.72,.1,
    black,
    x,1.92,z-.3,
    HQ
  );

  cube(
    .9,.5,.05,
    screen,
    x,1.95,z-.37,
    HQ
  );

  cube(
    .75,.06,.3,
    black,
    x,1.61,z-.5,
    HQ
  );
}

const deskPositions=[
  [-10,-4],
  [-5,-4],
  [4,-4],
  [9,-4],
  [-10,.5],
  [-5,.5],
  [4,.5],
  [9,.5]
];

deskPositions.forEach(p=>desk(p[0],p[1]));

/* =====================================================
   CHAIRS
===================================================== */

function chair(x,z){

  cyl(.42,.12,black,x,.7,z,HQ);

  cube(.1,1,.1,metal,x,.95,z,HQ);

  cube(.75,.12,.65,black,x,1.05,z,HQ);
}

[
 [-10,-5.4],
 [-5,-5.4],
 [4,-5.4],
 [9,-5.4],
 [-10,-.9],
 [-5,-.9],
 [4,-.9],
 [9,-.9]
].forEach(p=>chair(...p));

/* =====================================================
   MEETING ROOM
===================================================== */

cube(
  7,.15,4,
  wood,
  5.5,1.25,6.5,
  HQ
);

for(let x=3;x<=8;x+=2.5){
  chair(x,8.7);
  chair(x,4.3);
}

cube(
  6.5,2.6,.12,
  blueGlass,
  5.5,3.2,8.5,
  HQ
);

cube(
  3.6,1.7,.08,
  black,
  5.5,3.5,8.38,
  HQ
);

cube(
  3.1,1.25,.05,
  screen,
  5.5,3.5,8.3,
  HQ
);

/* =====================================================
   WORKERS
===================================================== */

const workers=[];

const data=[
 ["Aarav","Operations Manager","Operations"],
 ["Riya","Finance Analyst","Finance"],
 ["Kabir","Marketing Executive","Marketing"],
 ["Anaya","Product Manager","Product"],
 ["Vivaan","HR Manager","Human Resources"],
 ["Meera","Sales Executive","Sales"],
 ["Arjun","R&D Engineer","R&D"],
 ["Ishita","Accountant","Finance"]
];

function worker(name,role,dept,x,z,i){

  const g=new THREE.Group();

  g.position.set(x,.35,z);

  const shirt=i%2?shirtGreen:shirtBlue;

  /* legs */

  const l1=cube(.22,.85,.22,pants,-.17,.43,0,g);
  const l2=cube(.22,.85,.22,pants,.17,.43,0,g);

  /* body */

  cube(.68,1.05,.44,shirt,0,1.3,0,g);

  /* neck */

  cyl(.12,.16,skin,0,1.9,0,g);

  /* head */

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.31,16,12),
    skin
  );

  head.position.y=2.15;
  head.castShadow=true;
  g.add(head);

  /* hair */

  const hair=new THREE.Mesh(
    new THREE.SphereGeometry(
      .33,16,8,0,Math.PI*2,0,Math.PI/2
    ),
    black
  );

  hair.position.y=2.3;
  g.add(hair);

  /* arms */

  const a1=cube(.16,.72,.16,shirt,-.45,1.35,0,g);
  const a2=cube(.16,.72,.16,shirt,.45,1.35,0,g);

  g.userData={
    name,
    role,
    dept,
    phase:i*.8,
    homeX:x,
    homeZ:z,
    arm1:a1,
    arm2:a2,
    leftLeg:l1,
    rightLeg:l2
  };

  scene.add(g);
  workers.push(g);
}

data.forEach((d,i)=>{
  worker(
    d[0],
    d[1],
    d[2],
    deskPositions[i][0],
    deskPositions[i][1]+.9,
    i
  );
});

/* =====================================================
   WALKING ASSISTANTS
===================================================== */

const walkers=[];

function createWalker(x,z){

  const g=new THREE.Group();

  g.position.set(x,.35,z);

  const shirt=mat(
    Math.random()>.5?0x80633d:0x704e83
  );

  cube(.22,.85,.22,pants,-.17,.43,0,g);
  cube(.22,.85,.22,pants,.17,.43,0,g);

  cube(.68,1.05,.44,shirt,0,1.3,0,g);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.31,14,10),
    skin
  );

  head.position.y=2.15;
  g.add(head);

  g.userData={
    startX:x,
    startZ:z,
    phase:Math.random()*10
  };

  scene.add(g);
  walkers.push(g);
}

createWalker(-1,-1.8);
createWalker(2,-2.2);

/* =====================================================
   PARKING
===================================================== */

function car(x,z,s=1){

  const g=new THREE.Group();

  g.position.set(x,.4,z);
  g.scale.setScalar(s);

  cube(2.4,.55,1.2,black,0,.35,0,g);

  cube(1.3,.55,1,blueGlass,0,.75,0,g);

  for(const px of[-.85,.85]){

    const w1=cyl(.3,.18,black,px,.02,-.68,g);
    w1.rotation.x=Math.PI/2;

    const w2=w1.clone();
    w2.position.z=.68;
    g.add(w2);
  }

  scene.add(g);
}

car(-6,14,.9);
car(3,14,.9);
car(13,14,.8);

/* =====================================================
   TREES
===================================================== */

function tree(x,z){

  cyl(
    .25,1.8,
    mat(0x67472f),
    x,.9,z
  );

  const crown=new THREE.Mesh(
    new THREE.SphereGeometry(1.2,14,10),
    mat(0x47773e)
  );

  crown.position.set(x,2.4,z);
  crown.castShadow=true;

  scene.add(crown);
}

[
 [-21,-13],
 [-15,-14],
 [20,-13],
 [25,-4],
 [-22,8],
 [22,8],
 [-26,20],
 [27,21]
].forEach(p=>tree(...p));

/* =====================================================
   CITY
===================================================== */

function city(x,z,w,h,d){

  cube(
    w,h,d,
    mat(0x9da7ac),
    x,h/2,z
  );

  for(let y=2;y<h-1;y+=2.5){

    for(
      let xx=x-w/2+1;
      xx<x+w/2-1;
      xx+=2
    ){

      cube(
        .65,.65,.04,
        blueGlass,
        xx,y,z-d/2-.03
      );
    }
  }
}

city(-34,-4,9,12,8);
city(34,-3,10,16,9);
city(-35,15,8,9,8);
city(35,17,11,14,9);

/* =====================================================
   RAYCAST
===================================================== */

const ray=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function inspect(x,y){

  const r=canvas.getBoundingClientRect();

  pointer.x=((x-r.left)/r.width)*2-1;
  pointer.y=-((y-r.top)/r.height)*2+1;

  ray.setFromCamera(pointer,camera);

  const hits=ray.intersectObjects(workers,true);

  if(!hits.length)return;

  let obj=hits[0].object;

  while(obj.parent && !obj.userData.name){
    obj=obj.parent;
  }

  if(!obj.userData.name)return;

  const d=obj.userData;
window.dispatchEvent(
  new CustomEvent("EmpireEmployeeSelected", {
    detail: d
  })
);
  document.getElementById("ename").textContent=d.name;
  document.getElementById("erole").textContent="Role: "+d.role;
  document.getElementById("edept").textContent="Department: "+d.dept;
  document.getElementById("estatus").textContent="Status: Working";

  document.getElementById("employeePanel").style.display="block";
}

let downX=0;
let downY=0;

canvas.addEventListener("pointerdown",e=>{
  downX=e.clientX;
  downY=e.clientY;
});

canvas.addEventListener("pointerup",e=>{

  const dx=e.clientX-downX;
  const dy=e.clientY-downY;

  if(Math.sqrt(dx*dx+dy*dy)<8){
    inspect(e.clientX,e.clientY);
  }
});

document.getElementById("close").onclick=()=>{
  document.getElementById("employeePanel").style.display="none";
};

/* =====================================================
   ANIMATION
===================================================== */

const clock=new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const t=clock.getElapsedTime();

  workers.forEach((w,i)=>{

    const d=w.userData;

    w.position.y=.35+
      Math.sin(t*2+d.phase)*.025;

    d.arm1.rotation.z=
      Math.sin(t*3+d.phase)*.08;

    d.arm2.rotation.z=
      -Math.sin(t*3+d.phase)*.08;

  });

  walkers.forEach((w,i)=>{

    const d=w.userData;

    const distance=4;

    w.position.x=
      d.startX+
      Math.sin(t*.55+d.phase)*distance;

    w.position.z=
      d.startZ+
      Math.cos(t*.55+d.phase)*1.5;

    w.rotation.y=
      Math.atan2(
        Math.cos(t*.55+d.phase),
        Math.cos(t*.55+d.phase)
      );

  });

  controls.update();

  renderer.render(scene,camera);
}

animate();

/* =====================================================
   RESIZE
===================================================== */

addEventListener("resize",()=>{

  camera.aspect=innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
  );

});

</script>
<script src="./world3d.js"></script>
  <script src="./empire-sim.js"></script>
</body>
</html>
