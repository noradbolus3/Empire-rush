<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >

  <title>Empire Rush — Headquarters</title>


  <style>

    /* =====================================================
       BASE
       ===================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #b9c9d5;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }


    body {

      position: relative;

      touch-action: none;

      overscroll-behavior: none;
    }


    /* =====================================================
       THREE.JS CANVAS
       ===================================================== */

    #game {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      outline: none;

      touch-action: none;

      z-index: 1;
    }


    /* =====================================================
       OLD HUD REMOVAL
       =====================================================

       The previous world3d.html contained its own:

       #top
       .brand
       .stats
       .stat
       .tip

       Those elements are intentionally NOT recreated.

       HUD ownership now belongs exclusively to:

       main-game-hud.js
       ===================================================== */


    #top,
    .brand,
    .stats,
    .stat,
    .tip {

      display: none !important;
    }


    /* =====================================================
       EMPLOYEE PANEL
       ===================================================== */

    #employeePanel {

      display: none;

      position: fixed;

      right: 14px;

      bottom:
        calc(
          82px +
          env(safe-area-inset-bottom)
        );

      width: min(
        270px,
        calc(100vw - 28px)
      );

      padding: 16px;

      border-radius: 18px;

      background:
        rgba(10,16,25,.96);

      border:
        1px solid
        rgba(255,255,255,.12);

      color: #fff;

      box-shadow:
        0 18px 50px
        rgba(0,0,0,.42);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      z-index: 7000;

      pointer-events: auto;
    }


    #employeePanel h2 {

      margin:
        0 0 6px;

      font-size: 18px;

      font-weight: 900;
    }


    #employeePanel p {

      margin: 6px 0;

      color:
        rgba(255,255,255,.62);

      font-size: 12px;

      line-height: 1.35;
    }


    #close {

      position: absolute;

      right: 9px;
      top: 9px;

      width: 30px;
      height: 30px;

      border: 0;

      border-radius: 50%;

      background:
        rgba(255,255,255,.09);

      color: #fff;

      font-size: 19px;

      line-height: 30px;

      padding: 0;

      cursor: pointer;
    }


    #close:active {

      transform: scale(.94);
    }


    /* =====================================================
       DESKTOP EMPLOYEE PANEL
       ===================================================== */

    @media (min-width: 700px) {

      #employeePanel {

        right: 20px;

        bottom: 95px;

        width: 290px;
      }

    }


    /* =====================================================
       VERY SMALL MOBILE
       ===================================================== */

    @media (max-width: 360px) {

      #employeePanel {

        right: 8px;

        width:
          calc(100vw - 16px);

        padding: 14px;
      }

    }

  </style>

</head>


<body>


  <!-- ===================================================
       THREE.JS WORLD
       =================================================== -->

  <canvas id="game"></canvas>


  <!-- ===================================================
       EMPLOYEE INFORMATION PANEL
       =================================================== -->

  <div id="employeePanel">

    <button
      id="close"
      type="button"
      aria-label="Close employee"
    >
      ×
    </button>


    <h2 id="ename">
      Employee
    </h2>


    <p id="erole"></p>

    <p id="edept"></p>

    <p id="estatus"></p>

  </div>


  <!-- ===================================================
       THREE.JS IMPORT MAP
       =================================================== -->

  <script type="importmap">
  {
    "imports": {
      "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

      "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>


  <!-- ===================================================
       WORLD ENGINE
       PART 2 CONTINUES HERE
       =================================================== -->
  <script type="module">

    import * as THREE from "three";

    import {
      OrbitControls
    } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

    import {
      GLTFLoader
    } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

    import * as SkeletonUtils from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/utils/SkeletonUtils.js";


    /* =====================================================
       ENGINE
       ===================================================== */

    const canvas =
      document.getElementById("game");


    const scene =
      new THREE.Scene();


    scene.background =
      new THREE.Color(
        0xc8d5dc
      );


    scene.fog =
      new THREE.Fog(
        0xc8d5dc,
        60,
        125
      );


    const camera =
      new THREE.PerspectiveCamera(
        42,
        window.innerWidth /
          window.innerHeight,
        0.1,
        220
      );


    camera.position.set(
      26,
      16,
      29
    );


    const renderer =
      new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference:
          "high-performance"
      });


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        1.5
      )
    );


    renderer.shadowMap.enabled =
      true;


    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    /* =====================================================
       CAMERA
       ===================================================== */

    const controls =
      new OrbitControls(
        camera,
        canvas
      );


    controls.enableDamping =
      true;


    controls.dampingFactor =
      0.065;


    controls.minDistance =
      13;


    controls.maxDistance =
      70;


    controls.minPolarAngle =
      0.35;


    controls.maxPolarAngle =
      Math.PI / 2.18;


    controls.target.set(
      0,
      1.8,
      0
    );


    /* =====================================================
       LIGHTING
       ===================================================== */

    const hemisphere =
      new THREE.HemisphereLight(
        0xf5f9ff,
        0x52616a,
        2.4
      );


    scene.add(
      hemisphere
    );


    const sun =
      new THREE.DirectionalLight(
        0xffffff,
        3.2
      );


    sun.position.set(
      25,
      40,
      22
    );


    sun.castShadow =
      true;


    sun.shadow.mapSize.set(
      2048,
      2048
    );


    sun.shadow.camera.left =
      -55;


    sun.shadow.camera.right =
      55;


    sun.shadow.camera.top =
      55;


    sun.shadow.camera.bottom =
      -55;


    sun.shadow.camera.near =
      1;


    sun.shadow.camera.far =
      130;


    scene.add(
      sun
    );


    /* =====================================================
       MATERIAL SYSTEM
       ===================================================== */

    function material(
      color,
      roughness = 0.8,
      metalness = 0
    ){

      return new THREE.MeshStandardMaterial({

        color,

        roughness,

        metalness

      });

    }


    const MATERIALS = {

      grass:
        material(
          0x6d8f5c,
          1
        ),

      grassDark:
        material(
          0x557648,
          1
        ),

      sidewalk:
        material(
          0xc6c9c8,
          0.95
        ),

      curb:
        material(
          0x858b8c,
          0.9
        ),

      asphalt:
        material(
          0x272d33,
          0.95
        ),

      asphaltLight:
        material(
          0x343a40,
          0.95
        ),

      concrete:
        material(
          0xaeb5b6,
          0.95
        ),

      wall:
        material(
          0xd9dfe0,
          0.85
        ),

      wallDark:
        material(
          0x343c43,
          0.7
        ),

      wood:
        material(
          0x75553d,
          0.82
        ),

      dark:
        material(
          0x20262d,
          0.7
        ),

      metal:
        material(
          0x68737a,
          0.35,
          0.75
        ),

      green:
        material(
          0xb9ef2d,
          0.4,
          0.05
        ),

      treeTrunk:
        material(
          0x65452e,
          1
        ),

      treeLeaf:
        material(
          0x47763d,
          0.95
        ),

      skin:
        material(
          0xd49a73,
          0.9
        ),

      pants:
        material(
          0x292f36,
          0.9
        ),

      glass:
        new THREE.MeshStandardMaterial({

          color:
            0x72aabd,

          transparent:
            true,

          opacity:
            0.55,

          roughness:
            0.12,

          metalness:
            0.05
        }),

      glassDark:
        new THREE.MeshStandardMaterial({

          color:
            0x385e6d,

          transparent:
            true,

          opacity:
            0.7,

          roughness:
            0.1,

          metalness:
            0.1
        }),

      screen:
        material(
          0x195f6b,
          0.2,
          0.1
        )

    };


    /* =====================================================
       BASIC GEOMETRY HELPERS
       ===================================================== */

    function box(
      width,
      height,
      depth,
      mat,
      x = 0,
      y = 0,
      z = 0,
      parent = scene
    ){

      const mesh =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            width,
            height,
            depth
          ),
          mat
        );


      mesh.position.set(
        x,
        y,
        z
      );


      mesh.castShadow =
        true;


      mesh.receiveShadow =
        true;


      parent.add(
        mesh
      );


      return mesh;
    }


    function cylinder(
      radius,
      height,
      mat,
      x = 0,
      y = 0,
      z = 0,
      parent = scene,
      segments = 16
    ){

      const mesh =
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            segments
          ),
          mat
        );


      mesh.position.set(
        x,
        y,
        z
      );


      mesh.castShadow =
        true;


      mesh.receiveShadow =
        true;


      parent.add(
        mesh
      );


      return mesh;
    }


    function plane(
      width,
      depth,
      mat,
      x = 0,
      y = 0,
      z = 0,
      parent = scene
    ){

      const mesh =
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            width,
            depth
          ),
          mat
        );


      mesh.rotation.x =
        -Math.PI / 2;


      mesh.position.set(
        x,
        y,
        z
      );


      mesh.receiveShadow =
        true;


      parent.add(
        mesh
      );


      return mesh;
    }


    /* =====================================================
       WORLD ROOTS
       ===================================================== */

    const WORLD =
      new THREE.Group();


    WORLD.name =
      "EmpireRushWorld";


    scene.add(
      WORLD
    );


    const CITY =
      new THREE.Group();


    CITY.name =
      "EmpireRushCity";


    WORLD.add(
      CITY
    );


    const HQ =
      new THREE.Group();


    HQ.name =
      "PlayerHQ";


    WORLD.add(
      HQ
    );


    const NPC_ROOT =
      new THREE.Group();


    NPC_ROOT.name =
      "NPCWorld";


    WORLD.add(
      NPC_ROOT
    );


    const TRAFFIC_ROOT =
      new THREE.Group();


    TRAFFIC_ROOT.name =
      "TrafficWorld";


    WORLD.add(
      TRAFFIC_ROOT
    );


    /* =====================================================
       GROUND
       ===================================================== */

    plane(
      120,
      120,
      MATERIALS.grass,
      0,
      -0.03,
      0,
      CITY
    );


    /* =====================================================
       MAIN CITY ROAD GRID
       ===================================================== */

    function roadHorizontal(
      z,
      width = 8
    ){

      box(
        110,
        0.18,
        width,
        MATERIALS.asphalt,
        0,
        0.08,
        z,
        CITY
      );


      /*
       * Sidewalks stay OUTSIDE the road.
       */

      box(
        110,
        0.10,
        1.8,
        MATERIALS.sidewalk,
        0,
        0.17,
        z - width / 2 - 0.9,
        CITY
      );


      box(
        110,
        0.10,
        1.8,
        MATERIALS.sidewalk,
        0,
        0.17,
        z + width / 2 + 0.9,
        CITY
      );


      /*
       * Curbs.
       */

      box(
        110,
        0.13,
        0.18,
        MATERIALS.curb,
        0,
        0.18,
        z - width / 2,
        CITY
      );


      box(
        110,
        0.13,
        0.18,
        MATERIALS.curb,
        0,
        0.18,
        z + width / 2,
        CITY
      );


      /*
       * Center lane markings.
       */

      for(
        let x = -52;
        x <= 52;
        x += 7
      ){

        box(
          3.4,
          0.025,
          0.12,
          MATERIALS.concrete,
          x,
          0.20,
          z,
          CITY
        );

      }
    }


    function roadVertical(
      x,
      width = 8
    ){

      box(
        width,
        0.18,
        110,
        MATERIALS.asphalt,
        x,
        0.08,
        0,
        CITY
      );


      box(
        1.8,
        0.10,
        110,
        MATERIALS.sidewalk,
        x - width / 2 - 0.9,
        0.17,
        0,
        CITY
      );


      box(
        1.8,
        0.10,
        110,
        MATERIALS.sidewalk,
        x + width / 2 + 0.9,
        0.17,
        0,
        CITY
      );


      box(
        0.18,
        0.13,
        110,
        MATERIALS.curb,
        x - width / 2,
        0.18,
        0,
        CITY
      );


      box(
        0.18,
        0.13,
        110,
        MATERIALS.curb,
        x + width / 2,
        0.18,
        0,
        CITY
      );


      for(
        let z = -52;
        z <= 52;
        z += 7
      ){

        box(
          0.12,
          0.025,
          3.4,
          MATERIALS.concrete,
          x,
          0.20,
          z,
          CITY
        );

      }
    }


    /*
     * Planned grid.
     *
     * Roads are defined FIRST.
     * Buildings will occupy property
     * blocks BETWEEN these roads.
     */

    roadHorizontal(
      18
    );


    roadHorizontal(
      -20
    );


    roadVertical(
      19
    );


    roadVertical(
      -19
    );


    /* =====================================================
       PROPERTY SYSTEM
       ===================================================== */

    const properties = [];


    function createProperty(
      id,
      x,
      z,
      width,
      depth,
      type = "commercial"
    ){

      const property =
        new THREE.Group();


      property.name =
        "Property_" + id;


      property.position.set(
        x,
        0,
        z
      );


      property.userData = {

        id,

        type,

        width,

        depth,

        occupied:false

      };


      /*
       * Property surface.
       * It sits between roads,
       * never over them.
       */

      box(
        width,
        0.10,
        depth,
        MATERIALS.concrete,
        0,
        0.05,
        0,
        property
      );


      /*
       * Green setback around building.
       */

      box(
        Math.max(
          width - 1.2,
          2
        ),
        0.08,
        Math.max(
          depth - 1.2,
          2
        ),
        MATERIALS.grassDark,
        0,
        0.14,
        0,
        property
      );


      CITY.add(
        property
      );


      properties.push(
        property
      );


      return property;
    }


    /* =====================================================
       CITY PROPERTY BLOCKS
       ===================================================== */

    createProperty(
      "commercial_north",
      0,
      8,
      15,
      15,
      "commercial"
    );


    createProperty(
      "corporate_north",
      -29,
      8,
      13,
      15,
      "corporate"
    );


    createProperty(
      "retail_north",
      29,
      8,
      13,
      15,
      "retail"
    );


    createProperty(
      "commercial_south",
      0,
      -4,
      15,
      15,
      "commercial"
    );


    createProperty(
      "residential_west",
      -29,
      -4,
      13,
      15,
      "residential"
    );


    createProperty(
      "corporate_east",
      29,
      -4,
      13,
      15,
      "corporate"
    );


    /* =====================================================
       HQ PROPERTY
       ===================================================== */

    const HQ_PROPERTY =
      createProperty(
        "player_hq",
        0,
        42,
        32,
        20,
        "player-hq"
      );


    HQ_PROPERTY.userData.occupied =
      true;


    HQ.position.set(
      0,
      0,
      42
    );


    /* =====================================================
       HQ FOUNDATION
       ===================================================== */

    box(
      30,
      0.18,
      18,
      MATERIALS.floor,
      0,
      0.18,
      0,
      HQ
    );


    /* =====================================================
       HQ EXTERIOR
       ===================================================== */

    box(
      30,
      3.6,
      0.45,
      MATERIALS.wallDark,
      0,
      1.95,
      9,
      HQ
    );


    box(
      0.45,
      3.6,
      18,
      MATERIALS.wall,
      -15,
      1.95,
      0,
      HQ
    );


    box(
      0.45,
      3.6,
      18,
      MATERIALS.wall,
      15,
      1.95,
      0,
      HQ
    );


    /*
     * Front walls leave the entrance
     * physically open.
     */

    box(
      7,
      3.6,
      0.45,
      MATERIALS.wall,
      -11.5,
      1.95,
      -9,
      HQ
    );


    box(
      7,
      3.6,
      0.45,
      MATERIALS.wall,
      11.5,
      1.95,
      -9,
      HQ
    );


    /* =====================================================
       HQ GLASS FRONT
       ===================================================== */

    for(
      let x = -7.5;
      x <= 7.5;
      x += 3.75
    ){

      box(
        3.25,
        4.6,
        0.08,
        MATERIALS.glass,
        x,
        3.65,
        -9.08,
        HQ
      );

    }


    /* =====================================================
       HQ ENTRANCE
       ===================================================== */

    box(
      4.8,
      0.18,
      2.6,
      MATERIALS.concrete,
      0,
      0.28,
      -10.3,
      HQ
    );


    box(
      4.2,
      3.2,
      0.18,
      MATERIALS.glassDark,
      0,
      1.8,
      -9.12,
      HQ
    );


    /*
     * Entrance canopy.
     */

    box(
      7,
      0.22,
      3.2,
      MATERIALS.wallDark,
      0,
      4.8,
      -10.4,
      HQ
    );


    /* =====================================================
       HQ ROOF
       ===================================================== */

    box(
      31,
      0.28,
      19,
      MATERIALS.wallDark,
      0,
      4.05,
      0,
      HQ
    );


    /* =====================================================
       HQ SIGN
       ===================================================== */

    box(
      7,
      0.9,
      0.16,
      MATERIALS.dark,
      0,
      5.0,
      -9.35,
      HQ
    );


    box(
      3.2,
      0.18,
      0.05,
      MATERIALS.green,
      0,
      5.02,
      -9.46,
      HQ
    );


    /* =====================================================
       HQ PARKING
       ===================================================== */

    box(
      18,
      0.08,
      7,
      MATERIALS.asphaltLight,
      0,
      0.24,
      -14.5,
      HQ
    );


    for(
      let x = -7.5;
      x <= 7.5;
      x += 3
    ){

      box(
        0.07,
        0.025,
        5.5,
        MATERIALS.concrete,
        x,
        0.31,
        -14.5,
        HQ
      );

    }


    /* =====================================================
       CEO OFFICE
       ===================================================== */

    const CEO =
      new THREE.Group();


    CEO.name =
      "CEOOffice";


    CEO.position.set(
      -8.5,
      0,
      4.5
    );


    HQ.add(
      CEO
    );


    box(
      9,
      0.12,
      6,
      MATERIALS.wood,
      0,
      1.0,
      0,
      CEO
    );


    box(
      8.6,
      2.5,
      0.10,
      MATERIALS.glass,
      0,
      2.8,
      2.95,
      CEO
    );


    /*
     * Executive desk.
     */

    box(
      3.4,
      0.18,
      1.5,
      MATERIALS.wood,
      0,
      1.55,
      -0.5,
      CEO
    );


    box(
      1.1,
      0.7,
      0.06,
      MATERIALS.screen,
      0,
      1.98,
      -0.78,
      CEO
    );


    /*
     * Executive chair.
     */

    cylinder(
      0.55,
      0.14,
      MATERIALS.dark,
      0,
      0.72,
      -1.9,
      CEO
    );


    box(
      0.12,
      1.0,
      0.12,
      MATERIALS.metal,
      0,
      1.12,
      -1.9,
      CEO
    );


    box(
      0.8,
      1.1,
      0.35,
      MATERIALS.dark,
      0,
      1.35,
      -1.9,
      CEO
    );


    /* =====================================================
       EXECUTIVE MEETING TABLE
       ===================================================== */

    box(
      5.4,
      0.16,
      2.1,
      MATERIALS.wood,
      5.5,
      1.05,
      5.5,
      HQ
    );


    /* =====================================================
       OPEN OFFICE DESKS
       ===================================================== */

    function officeDesk(
      x,
      z
    ){

      box(
        2.5,
        0.16,
        1.15,
        MATERIALS.wood,
        x,
        1.15,
        z,
        HQ

    function building(
      x,
      z,
      width,
      depth,
      height,
      bodyMaterial,
      glassMaterial = MATERIALS.glass
    ){

      const group =
        new THREE.Group();

      group.position.set(
        x,
        0,
        z
      );

      cityBuildings.add(
        group
      );


      /* Building body */

      box(
        width,
        height,
        depth,
        bodyMaterial,
        0,
        height / 2,
        0,
        group
      );


      /* Vertical glass bands */

      const columns =
        Math.max(
          2,
          Math.floor(
            width / 2.4
          )
        );


      const rows =
        Math.max(
          1,
          Math.floor(
            height / 2.5
          )
        );


      for(
        let r = 0;
        r < rows;
        r++
      ){

        const y =
          1.35 +
          r * 2.35;


        if(
          y >
          height - 0.8
        ){
          continue;
        }


        for(
          let c = 0;
          c < columns;
          c++
        ){

          const xOffset =
            -width / 2 +
            1.1 +
            c * (
              (width - 2.2) /
              Math.max(
                columns - 1,
                1
              )
            );


          box(
            0.9,
            0.95,
            0.05,
            glassMaterial,
            xOffset,
            y,
            -depth / 2 - 0.04,
            group
          );

        }
      }


      /* Roof cap */

      box(
        width + 0.25,
        0.18,
        depth + 0.25,
        MATERIALS.dark,
        0,
        height + 0.09,
        0,
        group
      );


      /* Entrance */

      box(
        Math.min(
          3,
          width * 0.32
        ),
        2.1,
        0.12,
        MATERIALS.glassDark,
        0,
        1.05,
        -depth / 2 - 0.08,
        group
      );


      return group;
    }

    /* =====================================================
       EMPLOYEE MOVEMENT
       ===================================================== */

    function moveEmployee(
      human,
      x,
      z
    ){

      if(!human){
        return;
      }


      human.userData.targetX =
        x;


      human.userData.targetZ =
        z;


      human.userData.status =
        "Walking";

    }


    function updateEmployees(
      delta
    ){

      mixers.forEach(
        mixer => {

          mixer.update(
            delta
          );

        }
      );


      workers.forEach(
        human => {

          const data =
            human.userData;


          if(
            data.targetX === null ||
            data.targetZ === null
          ){

            return;

          }


          const dx =
            data.targetX -
            human.position.x;


          const dz =
            data.targetZ -
            human.position.z;


          const distance =
            Math.hypot(
              dx,
              dz
            );


          if(
            distance < 0.12
          ){

            human.position.x =
              data.targetX;

            human.position.z =
              data.targetZ;

            data.targetX =
              null;

            data.targetZ =
              null;

            data.status =
              "Working";

            return;

          }


          const angle =
            Math.atan2(
              dx,
              dz
            );


          human.rotation.y =
            angle;


          const speed =
            data.speed *
            delta;


          human.position.x +=
            Math.sin(
              angle
            ) *
            speed;


          human.position.z +=
            Math.cos(
              angle
            ) *
            speed;

        }
      );

    }

    const raycaster =
      new THREE.Raycaster();


    const pointer =
      new THREE.Vector2();


    function selectEmployee(
      event
    ){

      const rect =
        renderer.domElement
          .getBoundingClientRect();


      pointer.x =
        (
          event.clientX -
          rect.left
        ) /
        rect.width *
        2 -
        1;


      pointer.y =
        -(
          event.clientY -
          rect.top
        ) /
        rect.height *
        2 +
        1;


      raycaster.setFromCamera(
        pointer,
        camera
      );


      const hits =
        raycaster.intersectObjects(
          workers,
          true
        );


      if(
        !hits.length
      ){
        return;
      }


      let selected =
        hits[0].object;


      while(
        selected &&
        !workers.includes(
          selected
        )
      ){

        selected =
          selected.parent;

      }


      if(
        !selected
      ){
        return;
      }


      const data =
        selected.userData;


      window.dispatchEvent(
        new CustomEvent(
          "EmpireEmployeeSelected",
          {
            detail:{
              employee:data,
              worker:selected
            }
          }
        )
      );

    }


    renderer.domElement.addEventListener(
      "pointerdown",
      selectEmployee
    );


    /* =====================================================
       EMPLOYEE HIRED EVENT
       ===================================================== */

    window.addEventListener(
      "EmpireEmployeeHired",
      event => {

        const detail =
          event.detail ||
          {};


        if(
          !humanTemplate
        ){
          return;
        }


        const employee =
          detail.employee ||
          detail;


        if(
          !employee ||
          !employee.name
        ){
          return;
        }


        const human =
          SkeletonUtils.clone(
            humanTemplate
          );


        human.position.set(
          0,
          0.05,
          25
        );


        human.userData = {

          name:
            employee.name,

          role:
            employee.role ||
            "Employee",

          dept:
            employee.department ||
            employee.dept ||
            "General",

          status:
            "Walking",

          targetX:
            0,

          targetZ:
            4,

          speed:
            0.9

        };


        human.traverse(
          object => {

            if(
              object.isMesh
            ){

              object.castShadow =
                true;

              object.receiveShadow =
                true;

            }

          }
        );


        const mixer =
          new THREE.AnimationMixer(
            human
          );


        human.userData.mixer =
          mixer;


        scene.add(
          human
        );


        workers.push(
          human
        );


        mixers.push(
          mixer
        );


        moveEmployee(
          human,
          0,
          4
        );

      }
    );


    /* =====================================================
       EMPIRE WORLD API
       ===================================================== */

    function focusOn(
      x,
      z
    ){

      controls.target.set(
        x,
        0,
        z
      );

      camera.position.set(
        x + 22,
        22,
        z + 22
      );

      controls.update();

    }


    function moveWorkerTo(
      worker,
      x,
      z
    ){

      moveEmployee(
        worker,
        x,
        z
      );

    }


    window.EmpireWorld = {

      THREE,

      scene,

      camera,

      renderer,

      controls,

      HQ,

      workers,

      focusOn,

      moveWorkerTo,

      city:
        CITY,

      traffic:
        trafficCars,

      pedestrians,

      getEmployees(){
        return workers;
      }

    };


    /* =====================================================
       WORKFORCE COMPATIBILITY API
       ===================================================== */

    window.EmpireWorkforceWorld = {

      moveWorkerTo,

      getWorkers(){
        return workers;
      },

      focusEmployee(
        name
      ){

        const worker =
          workers.find(
            item =>
              item.userData &&
              item.userData.name ===
              name
          );


        if(
          !worker
        ){
          return false;
        }


        focusOn(
          worker.position.x,
          worker.position.z
        );


        return true;

      }

    };


    /* =====================================================
       WORLD READY EVENT
       ===================================================== */

    window.dispatchEvent(
      new CustomEvent(
        "EmpireWorldReady",
        {
          detail:
            window.EmpireWorld
        }
      )
    );


    /* =====================================================
       ANIMATION LOOP
       ===================================================== */

    let previousTime =
      performance.now();


    function animate(
      currentTime
    ){

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(
          (
            currentTime -
            previousTime
          ) /
          1000,
          0.05
        );


      previousTime =
        currentTime;


      updateEmployees(
        delta
      );


      updateTraffic(
        delta
      );


      controls.update();


      renderer.render(
        scene,
        camera
      );

    }


    animate(
      performance.now()
    );


    /* =====================================================
       RESIZE
       ===================================================== */

    function resize(){

      const width =
        window.innerWidth;


      const height =
        window.innerHeight;


      camera.aspect =
        width / height;


      camera.updateProjectionMatrix();


      renderer.setSize(
        width,
        height,
        false
      );


      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio ||
          1,
          2
        )
      );

    }


    window.addEventListener(
      "resize",
      resize
    );


    resize();


  </script>
