name: Android signed Release AAB

on:
  workflow_dispatch:

jobs:
  release-aab:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      actions: read
      contents: read
    timeout-minutes: 60
    env:
      KEYSTORE_GENERATION_RUN_ID: '39946321331'
      KEYSTORE_GENERATION_WORKFLOW_ID: '393905812'
      KEYSTORE_GENERATION_COMMIT: '0eca135baadf6fc05a07fe67dd211ace3fae959a'
      KEYSTORE_GENERATION_ARTIFACT_ID: '12497849066'
      EXPECTED_UPLOAD_CERT_SHA256: 'a3ee45b2a55aff0dbdd196d93faf1388422f9a20b452303ca753b24e6895f314'
    steps:
      - name: Checkout approved Round 42 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 33a0a966341074b6629c122dee344aa61135868c
          fetch-depth: 1

      - name: Verify approved source commit
        env:
          EXPECTED_COMMIT: 33a0a966341074b6629c122dee344aa61135868c
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install --clean

      - name: Install and verify bundletool
        run: |
          set -euo pipefail
          BUNDLETOOL="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --silent --show-error --location \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' \
            --output "$BUNDLETOOL"
          printf '%s  %s\n' \
            'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' \
            "$BUNDLETOOL" | sha256sum --check --status
          printf 'BUNDLETOOL_JAR=%s\n' "$BUNDLETOOL" >> "$GITHUB_ENV"

      - name: Verify the exact successful keystore-generation run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$KEYSTORE_GENERATION_RUN_ID" =~ ^[0-9]+$ ]]
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${KEYSTORE_GENERATION_RUN_ID}")"
          printf '%s' "$run_json" | jq -e \
            --argjson run_id "$KEYSTORE_GENERATION_RUN_ID" \
            --argjson workflow_id "$KEYSTORE_GENERATION_WORKFLOW_ID" \
            --arg commit "$KEYSTORE_GENERATION_COMMIT" \
            '(.id == $run_id) and (.workflow_id == $workflow_id) and (.event == "workflow_dispatch") and (.status == "completed") and (.conclusion == "success") and (.head_branch == "main") and (.head_sha == $commit)' >/dev/null

          artifact_name="empire-rush-encrypted-upload-keystore-${KEYSTORE_GENERATION_RUN_ID}"
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${KEYSTORE_GENERATION_RUN_ID}/artifacts")"
          printf '%s' "$artifact_json" | jq -e \
            --arg name "$artifact_name" \
            --argjson artifact_id "$KEYSTORE_GENERATION_ARTIFACT_ID" \
            '[.artifacts[] | select(.name == $name and .id == $artifact_id and .expired == false)] | length == 1' >/dev/null
          echo 'Verified the pinned successful generation run and unexpired encrypted artifact.'

      - name: Download encrypted upload-keystore backup
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: empire-rush-encrypted-upload-keystore-39946321331
          run-id: '39946321331'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/empire-rush-key-backup

      - name: Verify encrypted backup checksum and pinned metadata
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/empire-rush-key-backup"
          EXPECTED_FILES="$(printf '%s\n' \
            'ENCRYPTED_BACKUP_SHA256.txt' \
            'UPLOAD_KEY_CERT_SHA256.txt' \
            'UPLOAD_KEY_METADATA.txt' \
            'empire-rush-upload.jks.gpg' | sort)"
          ACTUAL_FILES="$(find "$BACKUP_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$ACTUAL_FILES" = "$EXPECTED_FILES"

          CIPHERTEXT="$BACKUP_DIR/empire-rush-upload.jks.gpg"
          expected_cipher_sha256="$(tr -d '\r\n' < "$BACKUP_DIR/ENCRYPTED_BACKUP_SHA256.txt")"
          actual_cipher_sha256="$(sha256sum -- "$CIPHERTEXT" | awk '{print $1}')"
          [[ "$expected_cipher_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$actual_cipher_sha256" = "$expected_cipher_sha256"

          certificate_sha256="$(tr -d '\r\n' < "$BACKUP_DIR/UPLOAD_KEY_CERT_SHA256.txt")"
          [[ "$certificate_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$certificate_sha256" = "$EXPECTED_UPLOAD_CERT_SHA256"
          grep -Fxq 'Format: JKS' "$BACKUP_DIR/UPLOAD_KEY_METADATA.txt"
          grep -Fxq 'Alias: empirerush-upload' "$BACKUP_DIR/UPLOAD_KEY_METADATA.txt"
          grep -Fxq "Certificate SHA-256: $EXPECTED_UPLOAD_CERT_SHA256" "$BACKUP_DIR/UPLOAD_KEY_METADATA.txt"
          grep -Fxq "Encrypted backup SHA-256: $expected_cipher_sha256" "$BACKUP_DIR/UPLOAD_KEY_METADATA.txt"
          grep -Fxq 'Runner recovery test: PASS; decrypted bytes and certificate fingerprint match' "$BACKUP_DIR/UPLOAD_KEY_METADATA.txt"
          echo 'Encrypted artifact checksum, alias, JKS metadata, and pinned certificate fingerprint match.'

      - name: Decrypt verified keystore to runner temporary storage
        env:
          ANDROID_KEYSTORE_BACKUP_PASSPHRASE: ${{ secrets.ANDROID_KEYSTORE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          set +x
          : "${ANDROID_KEYSTORE_BACKUP_PASSPHRASE:?Missing ANDROID_KEYSTORE_BACKUP_PASSPHRASE}"
          umask 077
          KEYSTORE="$RUNNER_TEMP/empire-rush-upload.jks"
          CIPHERTEXT="$RUNNER_TEMP/empire-rush-key-backup/empire-rush-upload.jks.gpg"
          gpg --batch --yes --quiet --no-symkey-cache \
            --pinentry-mode loopback --passphrase-fd 3 \
            --output "$KEYSTORE" --decrypt "$CIPHERTEXT" \
            3<<<"$ANDROID_KEYSTORE_BACKUP_PASSPHRASE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"
          printf 'ANDROID_KEYSTORE_FILE=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: empirerush-upload
        run: |
          set -euo pipefail
          set +x
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing configured alias}"

          umask 077
          KEYSTORE="$RUNNER_TEMP/empire-rush-upload.jks"
          test -s "$KEYSTORE"
          export ANDROID_KEYSTORE_FILE="$KEYSTORE"

          cat > "$RUNNER_TEMP/UploadKeyCert.java" <<'JAVA'
          import java.io.DataInputStream;
          import java.io.InputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.PrivateKey;
          import java.security.cert.Certificate;

          public class UploadKeyCert {
            public static void main(String[] args) throws Exception {
              String path = System.getenv("ANDROID_KEYSTORE_FILE");
              String alias = System.getenv("ANDROID_KEY_ALIAS");
              char[] storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD").toCharArray();
              char[] keyPassword = System.getenv("ANDROID_KEY_PASSWORD").toCharArray();

              try (DataInputStream header = new DataInputStream(Files.newInputStream(Path.of(path)))) {
                int magic = header.readInt();
                int version = header.readInt();
                if (magic != 0xfeedfeed || (version != 1 && version != 2)) {
                  throw new IllegalArgumentException("Keystore must be a Java JKS-format file");
                }
              }

              KeyStore store = KeyStore.getInstance("JKS");
              try (InputStream in = Files.newInputStream(Path.of(path))) {
                store.load(in, storePassword);
              }
              if (!store.isKeyEntry(alias)) {
                throw new IllegalArgumentException("Configured alias is not a private-key entry");
              }
              Key key = store.getKey(alias, keyPassword);
              if (!(key instanceof PrivateKey)) {
                throw new IllegalArgumentException("Configured alias does not unlock a private key");
              }
              Certificate certificate = store.getCertificate(alias);
              if (certificate == null) {
                throw new IllegalArgumentException("Configured alias has no certificate");
              }
              byte[] digest = MessageDigest.getInstance("SHA-256").digest(certificate.getEncoded());
              StringBuilder hex = new StringBuilder();
              for (byte value : digest) hex.append(String.format("%02x", value));
              System.out.println(hex);
            }
          }
          JAVA

          UPLOAD_KEY_CERT_SHA256="$(java "$RUNNER_TEMP/UploadKeyCert.java")"
          test "${#UPLOAD_KEY_CERT_SHA256}" -eq 64
          test "$UPLOAD_KEY_CERT_SHA256" = "$EXPECTED_UPLOAD_CERT_SHA256"
          printf 'ANDROID_KEYSTORE_FILE=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"
          printf 'UPLOAD_KEY_CERT_SHA256=%s\n' "$UPLOAD_KEY_CERT_SHA256" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path('android/app/build.gradle')
          s = p.read_text()
          signing_config = (
              "        release {\n"
              "            storeFile file(System.getenv(\"ANDROID_KEYSTORE_FILE\"))\n"
              "            storePassword System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n"
              "            keyAlias System.getenv(\"ANDROID_KEY_ALIAS\")\n"
              "            keyPassword System.getenv(\"ANDROID_KEY_PASSWORD\")\n"
              "        }\n"
          )

          signing_match = re.search(r'(?ms)^    signingConfigs\s*\{(.*?)^    \}', s)
          if signing_match is None:
              build_types_pos = s.find('    buildTypes {')
              if build_types_pos < 0:
                  raise SystemExit('Could not find Expo Android buildTypes block')
              new_signing_block = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            storeFile file(System.getenv(\"ANDROID_KEYSTORE_FILE\"))\n"
                  "            storePassword System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n"
                  "            keyAlias System.getenv(\"ANDROID_KEY_ALIAS\")\n"
                  "            keyPassword System.getenv(\"ANDROID_KEY_PASSWORD\")\n"
                  "        }\n"
                  "    }\n"
              )
              s = s[:build_types_pos] + new_signing_block + s[build_types_pos:]
          elif re.search(r'(?m)^\s*release\s*\{', signing_match.group(1)) is None:
              s = s[:signing_match.end(1)] + signing_config + s[signing_match.end(1):]

          build_types_pos = s.find('    buildTypes {')
          if build_types_pos < 0:
              raise SystemExit('Could not find Expo Android buildTypes block')
          release_match = re.search(r'(?m)^        release\s*\{', s[build_types_pos:])
          if release_match is None:
              raise SystemExit('Could not find Expo Android release build type')
          release_start = build_types_pos + release_match.end()
          release_end_match = re.search(r'(?m)^        \}', s[release_start:])
          if release_end_match is None:
              raise SystemExit('Could not locate end of Expo Android release build type')
          release_end = release_start + release_end_match.start()
          release_body = s[release_start:release_end]
          if 'signingConfig signingConfigs.release' not in release_body:
              if 'signingConfig signingConfigs.debug' in release_body:
                  release_body = release_body.replace(
                      'signingConfig signingConfigs.debug',
                      'signingConfig signingConfigs.release', 1)
              else:
                  release_body = '\n            signingConfig signingConfigs.release' + release_body
              s = s[:release_start] + release_body + s[release_end:]

          p.write_text(s)
          PY

      - name: Generate offline JavaScript bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: Build signed Release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: empirerush-upload
        run: ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Verify AAB, package ID, signing certificate, and source commit
        env:
          EXPECTED_COMMIT: 33a0a966341074b6629c122dee344aa61135868c
          EXPECTED_PACKAGE_ID: com.empirerush.tycoon
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/jarsigner-verify.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/jarsigner-verify.txt"

          AAB_SIGNER_SHA256="$(keytool -printcert -jarfile "$AAB" | \
            awk -F': ' '/SHA256:/{gsub(/:/, "", $2); gsub(/[[:space:]]/, "", $2); print tolower($2); exit}')"
          test -n "$AAB_SIGNER_SHA256"
          test "$AAB_SIGNER_SHA256" = "$UPLOAD_KEY_CERT_SHA256"

          java -jar "$BUNDLETOOL_JAR" validate --bundle="$AAB"
          AAB_PACKAGE_ID="$(java -jar "$BUNDLETOOL_JAR" dump manifest \
            --bundle="$AAB" --module=base --xpath='/manifest/@package')"
          test "$AAB_PACKAGE_ID" = "$EXPECTED_PACKAGE_ID"
          unzip -Z1 "$AAB" | grep -Fxq 'base/assets/index.android.bundle'

          sha256sum "$AAB" > SHA256SUMS-release-aab.txt
          printf 'SOURCE_COMMIT=%s\n' "$EXPECTED_COMMIT" > RELEASE_BUILD_METADATA.txt
          printf 'PACKAGE_ID=%s\n' "$EXPECTED_PACKAGE_ID" >> RELEASE_BUILD_METADATA.txt
          printf 'UPLOAD_CERT_SHA256=%s\n' "$AAB_SIGNER_SHA256" > UPLOAD_CERT_SHA256.txt
          stat -c 'AAB_BYTES=%s' "$AAB"

      - name: Upload signed Release AAB and public verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: empire-rush-signed-release-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS-release-aab.txt
            RELEASE_BUILD_METADATA.txt
            UPLOAD_CERT_SHA256.txt
          if-no-files-found: error
          retention-days: 3

      - name: Remove temporary signing material
        if: always()
        run: |
          set -u
          cleanup_status=0
          rm -f -- \
            "$RUNNER_TEMP/empire-rush-upload.jks" \
            "$RUNNER_TEMP/UploadKeyCert.java" \
            "$RUNNER_TEMP/UploadKeyCert.class" \
            "$RUNNER_TEMP/jarsigner-verify.txt" \
            "$RUNNER_TEMP/bundletool-all-1.18.3.jar" || cleanup_status=$?
          rm -rf -- "$RUNNER_TEMP/empire-rush-key-backup" || cleanup_status=$?
          exit "$cleanup_status"
