name: Android signed Release AAB

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit or branch to build
        required: true
        default: round-40-construction-company

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          mkdir -p android/app/signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/signing/empire-rush-release.jks
          chmod 600 android/app/signing/empire-rush-release.jks
          export ANDROID_KEYSTORE_FILE="$GITHUB_WORKSPACE/android/app/signing/empire-rush-release.jks"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          signing = '''\n    signingConfigs {\n        release {\n            storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n'''
          if 'signingConfigs {' not in s:
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = s.replace('    buildTypes {\n        release {', '    buildTypes {\n        release {\n            signingConfig signingConfigs.release', 1)
          p.write_text(s)
          PY
          cat >> "$GITHUB_ENV" <<EOF
          ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/signing/empire-rush-release.jks
          ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS
          EOF

      - name: Generate offline JavaScript bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: Build signed Release AAB
        working-directory: android
        run: ./gradlew clean bundleRelease --no-daemon --stacktrace

      - name: Verify AAB, package ID, signing certificate, and source commit
        env:
          EXPECTED_COMMIT: ${{ inputs.source_ref }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$EXPECTED_COMMIT")"
          jarsigner -verify -verbose -certs "$AAB" >/tmp/jarsigner.txt
          grep -q 'jar verified' /tmp/jarsigner.txt
          keytool -printcert -jarfile "$AAB" | tee /tmp/aab-certificate.txt
          grep -q 'SHA256:' /tmp/aab-certificate.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump packagename "$AAB" | grep -q 'com.empirerush.tycoon'
          unzip -l "$AAB" | grep -q 'assets/index.android.bundle'
          sha256sum "$AAB" | tee SHA256SUMS-release-aab.txt
          stat -c 'AAB_BYTES=%s' "$AAB"
          printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)" | tee RELEASE_BUILD_METADATA.txt
          printf 'PACKAGE_ID=com.empirerush.tycoon\n' | tee -a RELEASE_BUILD_METADATA.txt

      - name: Upload signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: empire-rush-signed-release-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            SHA256SUMS-release-aab.txt
            RELEASE_BUILD_METADATA.txt
            /tmp/aab-certificate.txt
          if-no-files-found: error
