name: Android builds

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  native-project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native Android project readiness
        run: |
          if [ -x android/gradlew ]; then
            echo "Native Android project detected; build job will run."
          else
            echo "No android/gradlew found yet. This repository currently contains the Unity-ready core only."
            echo "Add the Android/Unity export before enabling APK/AAB builds."
          fi

  android-build:
    needs: native-project-check
    if: ${{ hashFiles('android/gradlew') != '' }}
    runs-on: ubuntu-latest
    env:
      TARGET_SDK_VERSION: '34'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: empire-rush-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
