name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Inject exact build identity
        run: sed -i "s/BUILD_COMMIT = '.*'/BUILD_COMMIT = '${GITHUB_SHA:0:7}'/" src/config/buildInfo.ts

      - name: Enable standalone offline JavaScript bundle
        working-directory: android
        run: |
          # Expo/RN skips JS bundling for debug by default because it expects Metro.
          # An APK distributed for device testing must contain the bundle instead.
          sed -i '/^[[:space:]]*debuggableVariants[[:space:]]*=/d' app/build.gradle
          sed -i '/^[[:space:]]*react[[:space:]]*{/a\    debuggableVariants = []' app/build.gradle

      - name: Generate offline JavaScript bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: Clean and build standalone debug APK
        working-directory: android
        run: ./gradlew clean && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify embedded JavaScript bundle
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.android.bundle'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: empire-rush-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
