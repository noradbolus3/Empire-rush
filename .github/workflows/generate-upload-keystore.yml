name: Generate encrypted Empire Rush upload keystore

run-name: Generate Empire Rush upload keystore (${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type GENERATE-EMPIRE-RUSH-UPLOAD-KEY to create the upload signing identity
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: empire-rush-upload-keystore
  cancel-in-progress: false

jobs:
  generate-upload-keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      ANDROID_KEY_ALIAS: empirerush-upload
    steps:
      - name: Check confirmation, required reviewer protection, and secret readiness
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BACKUP_PASSPHRASE: ${{ secrets.ANDROID_KEYSTORE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          set +x
          test "$CONFIRMATION" = 'GENERATE-EMPIRE-RUSH-UPLOAD-KEY' || {
            echo 'Explicit confirmation phrase did not match; no key was generated.' >&2
            exit 1
          }
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing production secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_PASSWORD:?Missing production secret ANDROID_KEY_PASSWORD}"
          : "${ANDROID_KEYSTORE_BACKUP_PASSPHRASE:?Missing production secret ANDROID_KEYSTORE_BACKUP_PASSPHRASE}"

          python3 - <<'PY'
          import os
          requirements = {
              'ANDROID_KEYSTORE_PASSWORD': 16,
              'ANDROID_KEY_PASSWORD': 16,
              'ANDROID_KEYSTORE_BACKUP_PASSPHRASE': 40,
          }
          for name, minimum in requirements.items():
              value = os.environ.get(name, '')
              if len(value) < minimum or '\n' in value or '\r' in value:
                  raise SystemExit(f'{name} must be at least {minimum} characters and contain no newline')
          PY

          if ! environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" 2>/dev/null)"; then
            echo 'The production environment is missing or not readable; create it in repository Settings first.' >&2
            exit 1
          fi
          has_reviewer="$(printf '%s' "$environment_json" | jq -r '[.protection_rules[]?.type] | index("required_reviewers") != null')"
          if [ "$has_reviewer" != 'true' ]; then
            echo 'The production environment has no required reviewer; configure a reviewer in Settings before generating the key.' >&2
            exit 1
          fi
          echo 'Preflight passed: protected environment and required secrets are available.'

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate a dedicated JKS upload keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          KEYSTORE="$RUNNER_TEMP/empire-rush-upload.jks"
          keytool -genkeypair -noprompt \
            -storetype JKS \
            -keystore "$KEYSTORE" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -sigalg SHA256withRSA \
            -validity 10000 \
            -dname 'CN=Empire Rush Android Upload,O=noradbolus3' \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"
          printf 'KEYSTORE_PATH=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"

      - name: Verify JKS header, private-key alias, and certificate fingerprint
        id: verify_key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          cat > "$RUNNER_TEMP/JksFingerprint.java" <<'JAVA'
          import java.io.DataInputStream;
          import java.io.InputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.PrivateKey;
          import java.security.cert.Certificate;

          public class JksFingerprint {
            public static void main(String[] args) throws Exception {
              String path = args[0];
              String alias = System.getenv("ANDROID_KEY_ALIAS");
              char[] storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD").toCharArray();
              char[] keyPassword = System.getenv("ANDROID_KEY_PASSWORD").toCharArray();
              try (DataInputStream header = new DataInputStream(Files.newInputStream(Path.of(path)))) {
                int magic = header.readInt();
                int version = header.readInt();
                if (magic != 0xfeedfeed || (version != 1 && version != 2)) {
                  throw new IllegalArgumentException("File is not a supported Java JKS keystore");
                }
              }
              KeyStore store = KeyStore.getInstance("JKS");
              try (InputStream in = Files.newInputStream(Path.of(path))) {
                store.load(in, storePassword);
              }
              if (!store.isKeyEntry(alias)) {
                throw new IllegalArgumentException("Configured alias is not a private-key entry");
              }
              Key key = store.getKey(alias, keyPassword);
              if (!(key instanceof PrivateKey)) {
                throw new IllegalArgumentException("Configured alias does not unlock a private key");
              }
              Certificate certificate = store.getCertificate(alias);
              if (certificate == null) {
                throw new IllegalArgumentException("Configured alias has no certificate");
              }
              byte[] digest = MessageDigest.getInstance("SHA-256").digest(certificate.getEncoded());
              StringBuilder hex = new StringBuilder();
              for (byte value : digest) hex.append(String.format("%02x", value));
              System.out.println(hex);
            }
          }
          JAVA
          fingerprint="$(java "$RUNNER_TEMP/JksFingerprint.java" "$KEYSTORE_PATH")"
          test "${#fingerprint}" -eq 64
          printf '%s\n' "$fingerprint" > "$RUNNER_TEMP/UPLOAD_KEY_CERT_SHA256.txt"
          printf 'UPLOAD_KEY_CERT_SHA256=%s\n' "$fingerprint" >> "$GITHUB_ENV"
          echo "Public upload certificate SHA-256: $fingerprint"

      - name: Encrypt backup and verify recovery
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BACKUP_PASSPHRASE: ${{ secrets.ANDROID_KEYSTORE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          set +x
          command -v gpg >/dev/null
          CIPHERTEXT="$RUNNER_TEMP/empire-rush-upload.jks.gpg"
          RESTORED="$RUNNER_TEMP/empire-rush-upload-restored.jks"

          gpg --batch --yes --quiet --no-symkey-cache \
            --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 \
            --output "$CIPHERTEXT" "$KEYSTORE_PATH" \
            3<<<"$ANDROID_KEYSTORE_BACKUP_PASSPHRASE"
          chmod 600 "$CIPHERTEXT"
          test -s "$CIPHERTEXT"

          gpg --batch --yes --quiet --no-symkey-cache \
            --pinentry-mode loopback --passphrase-fd 3 \
            --output "$RESTORED" --decrypt "$CIPHERTEXT" \
            3<<<"$ANDROID_KEYSTORE_BACKUP_PASSPHRASE"
          chmod 600 "$RESTORED"
          cmp --silent "$KEYSTORE_PATH" "$RESTORED"

          restored_fingerprint="$(java "$RUNNER_TEMP/JksFingerprint.java" "$RESTORED")"
          test "$restored_fingerprint" = "$UPLOAD_KEY_CERT_SHA256"
          printf '%s\n' "$UPLOAD_KEY_CERT_SHA256" > "$RUNNER_TEMP/UPLOAD_KEY_CERT_SHA256.txt"
          sha256sum "$CIPHERTEXT" | awk '{print $1}' > "$RUNNER_TEMP/ENCRYPTED_BACKUP_SHA256.txt"
          cat > "$RUNNER_TEMP/UPLOAD_KEY_METADATA.txt" <<EOF
          Format: JKS
          Alias: $ANDROID_KEY_ALIAS
          Algorithm: RSA-2048 / SHA256withRSA
          Certificate SHA-256: $UPLOAD_KEY_CERT_SHA256
          Encrypted backup SHA-256: $(cat "$RUNNER_TEMP/ENCRYPTED_BACKUP_SHA256.txt")
          Runner recovery test: PASS; decrypted bytes and certificate fingerprint match
          EOF
          echo 'Encrypted backup recovery check: PASS; restored keystore and certificate fingerprint match.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted backup and public verification metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: empire-rush-encrypted-upload-keystore-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/empire-rush-upload.jks.gpg
            ${{ runner.temp }}/UPLOAD_KEY_CERT_SHA256.txt
            ${{ runner.temp }}/ENCRYPTED_BACKUP_SHA256.txt
            ${{ runner.temp }}/UPLOAD_KEY_METADATA.txt
          if-no-files-found: error
          retention-days: 7

      - name: Report owner-held backup status
        if: success()
        run: |
          echo '## Upload key generation' >> "$GITHUB_STEP_SUMMARY"
          echo "Certificate SHA-256: $UPLOAD_KEY_CERT_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo 'Encrypted artifact uploaded. Runner recovery verification passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Owner-held iPad backup: PENDING until the artifact is downloaded and preserved by the owner.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove plaintext and temporary files
        if: always()
        run: |
          rm -f -- \
            "$RUNNER_TEMP/empire-rush-upload.jks" \
            "$RUNNER_TEMP/empire-rush-upload-restored.jks" \
            "$RUNNER_TEMP/JksFingerprint.java" \
            "$RUNNER_TEMP/JksFingerprint.class" \
            "$RUNNER_TEMP/UPLOAD_KEY_CERT_SHA256.txt" \
            "$RUNNER_TEMP/ENCRYPTED_BACKUP_SHA256.txt" \
            "$RUNNER_TEMP/UPLOAD_KEY_METADATA.txt" \
            "$RUNNER_TEMP/empire-rush-upload.jks.gpg"
